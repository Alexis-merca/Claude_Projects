}

function vue() {
  const c = client();
  const p = proc();
  const totaux = {
    processus: c ? c.processus.length : 0,
    etapes: c ? c.processus.reduce((n, x) => n + x.etapes.length, 0) : 0,
    frictions: c ? c.processus.reduce((n, x) => n + x.frictions.length, 0) : 0
  };

  if (etat.impression) return vueImpression(c, totaux);

  return `
  ${vueBarre()}
  ${vueTiroir()}
  <main class="principal">
    ${vueEntete(totaux)}
    ${etat.edition ? vueFicheClient() : ''}
    <section class="section">
      ${vueOnglets()}
      <div class="section">
        ${etat.edition ? '' : `
          <div class="groupe" style="gap:6px">
            <h2>${e(p ? p.nom : '')}</h2>
            <span class="sourdine" style="font-size:16px">${e(p ? p.soustitre : '')}</span>
          </div>`}
        ${etat.edition ? vueCarteProcessus() : ''}
        ${vueFlux()}
        ${etat.edition && etat.tableau ? vueTableEtapes() : ''}
        <div class="grille-analyse">
          ${vueFrictions()}
          ${vueChiffres()}
        </div>
      </div>
    </section>
    ${vueEnvironnementIT()}
    ${vueSynthese(totaux)}
  </main>`;
}

/* ==========================================================================
   DOCUMENT D'IMPRESSION — une page par processus, puis l'IT et la synthèse.
   Chaque page porte un bandeau d'identification : le client reste lisible
   sur une feuille détachée du reste du dossier.
   ========================================================================== */
function pageImpression(c, sujet, corps) {
  const meta = [c.site, c.date ? 'visite du ' + c.date : '']
    .filter((x) => x && String(x).trim()).join(' · ');
  return `
  <section class="page-impression">
    <div class="page-impression__bandeau">
      <span class="page-impression__client">${e(c.nom)}${meta ? ` <span class="sourdine" style="font-weight:400">— ${e(meta)}</span>` : ''}</span>
      <span class="page-impression__sujet">${e(sujet)}</span>
    </div>
    ${corps}
  </section>`;
}

function vueImpression(c, totaux) {
  const n = c.processus.length;

  const pages = c.processus.map((p, i) => pageImpression(c, `Processus ${i + 1}/${n}`, `
    <div class="groupe" style="gap:6px">
      <h2>${e(p.nom)}</h2>
      <span class="sourdine" style="font-size:16px">${e(p.soustitre || '')}</span>
    </div>
    ${vueFlux(p)}
    <div class="grille-analyse">
      ${vueFrictions(p)}
      ${vueChiffres(p)}
    </div>`)).join('');

  return `
  <main class="principal principal--impression">
    ${pages}
    ${pageImpression(c, 'Environnement IT', vueEnvironnementIT())}
    ${pageImpression(c, 'Synthèse', vueSynthese(totaux))}
  </main>`;
}

/* ==========================================================================
   FLÈCHES DU FLUX — mesurées après coup, une fois la grille posée.
   On lit offsetLeft/offsetTop (coordonnées de mise en page) et non
   getBoundingClientRect : ainsi le tracé reste juste quand le diagramme
   est dézoomé (CSS zoom), puisque le SVG vit dans le même repère.
   ========================================================================== */
/** Trace les flèches d'un diagramme. `zone` est le `.flux` visé et `p` le
    processus qu'il représente : sans eux on retombe sur celui affiché, mais le
    document d'impression en contient un par processus et doit les désigner. */
function tracerFleches(zone, p) {
  if (!zone) zone = document.querySelector('.flux');
  const svg = zone && zone.querySelector('.flux-svg');
  if (!zone || !svg) return;

  const cibles = zone.querySelector('.flux-svg--cibles');
  if (!p) p = proc();
  const cartes = Array.from(zone.querySelectorAll('[data-etape]'))
    .sort((a, b) => Number(a.dataset.etape) - Number(b.dataset.etape));
  const chemins = [];
  const zonesClic = [];

  /* Cumule les offsets jusqu'au diagramme : on ne dépend ainsi d'aucun
     choix de positionnement CSS dans les niveaux intermédiaires. */
  const boite = (el) => {
    let x = 0, y = 0, cur = el;
    while (cur && cur !== zone) { x += cur.offsetLeft; y += cur.offsetTop; cur = cur.offsetParent; }
    /* offsetTop ignore les transform : on rajoute le décalage des cartes à cheval. */
    y += Number(el.dataset.decalage || 0);
    return { x, y, l: el.offsetWidth, h: el.offsetHeight };
  };

  for (let i = 0; i < cartes.length - 1; i++) {
    const a = boite(cartes[i]), b = boite(cartes[i + 1]);
    const x1 = a.x + a.l + 2;
    const y1 = a.y + a.h / 2;
    const x2 = b.x - 3;
    const y2 = b.y + b.h / 2;
    const dx = x2 - x1, dy = y2 - y1;
    const mx = x1 + dx / 2;
    /* Le rayon doit tenir dans l'écart horizontal ET vertical : sinon les deux
       quarts de cercle se chevauchent, le tracé repart en arrière et la pointe
       déborde sur les cartes. Sous 2 px de rayon utile, ou si les cartes se
       chevauchent horizontalement, on trace un simple segment. */
    const r = Math.min(9, Math.abs(dx) / 2 - 2, Math.abs(dy) / 2);
    const s = dy > 0 ? 1 : -1;
    const d = (Math.abs(dy) < 2 || r < 2 || dx <= 0)
      ? `M${x1},${y1} L${x2},${y2}`
      : `M${x1},${y1} L${mx - r},${y1} Q${mx},${y1} ${mx},${y1 + s * r} L${mx},${y2 - s * r} Q${mx},${y2} ${mx + r},${y2} L${x2},${y2}`;

    /* Le lien est porté par l'étape qui reçoit la flèche. */
    const nature = (p && p.etapes[i + 1] && p.etapes[i + 1].lien) || '';
    const style = LIENS[nature] || LIENS[''];

    if (etat.edition && !etat.impression) {
      zonesClic.push(`<path class="fleche-cible" data-action="basculer-lien" data-i="${i + 1}" d="${d}"
        fill="none" stroke="transparent" stroke-width="16"><title>Lien ${style.libelle} — cliquer pour changer</title></path>`);
    }
    chemins.push(`<path d="${d}" fill="none" stroke="${style.couleur}" stroke-width="1.5"${
      style.tirets ? ` stroke-dasharray="${style.tirets}"` : ''} marker-end="url(#${style.marqueur})"/>`);
  }

  const pointe = (id, couleur) =>
    `<marker id="${id}" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
       <path d="M0,0 L6,3 L0,6 z" fill="${couleur}"></path>
     </marker>`;

  const largeur = zone.scrollWidth + 'px';
  const hauteur = zone.offsetHeight + 'px';
  svg.style.width = largeur;
  svg.style.height = hauteur;
  svg.innerHTML = `
    <defs>
      ${pointe('pointe-neutre', '#A485FE')}
      ${pointe('pointe-auto', '#6733FD')}
      ${pointe('pointe-manuel', '#CE6700')}
    </defs>${chemins.join('')}`;

  if (cibles) {
    cibles.style.width = largeur;
    cibles.style.height = hauteur;
    cibles.innerHTML = zonesClic.join('');
  }
}

/** Tous les diagrammes présents dans la page. À l'écran il n'y en a qu'un ;
    à l'impression il y en a un par processus, chacun étiqueté `data-proc`. */
function tracerTousLesFlux() {
  const c = client();
  document.querySelectorAll('.flux').forEach((zone) => {
    const id = zone.dataset.proc;
    const p = (c && c.processus.find((x) => x.id === id)) || null;
    tracerFleches(zone, p);
  });
}

/* ==========================================================================
   RENDU — reconstruit tout, puis restitue focus, caret et défilement
   ========================================================================== */
const racine = document.getElementById('racine');

function rendre() {
  const actif = document.activeElement;
  const cle = actif && actif.dataset ? actif.dataset.champ : null;
  let selDebut = null, selFin = null;
  try {
    if (actif && 'selectionStart' in actif) { selDebut = actif.selectionStart; selFin = actif.selectionEnd; }
  } catch (err) { /* input type=range : pas de sélection */ }
  const defileur = document.querySelector('.flux-defile');
  const defileX = defileur ? defileur.scrollLeft : 0;
  const y = window.scrollY;

  racine.innerHTML = vue();

  const nouveauDefileur = document.querySelector('.flux-defile');
  if (nouveauDefileur) nouveauDefileur.scrollLeft = defileX;
  window.scrollTo(0, y);

  if (cle) {
    const champ = racine.querySelector(`[data-champ="${cle}"]`);
    if (champ) {
      champ.focus();
      if (selDebut != null && champ.setSelectionRange) {
        try { champ.setSelectionRange(selDebut, selFin); } catch (err) { /* select : non applicable */ }
      }
    }
  }

  ajusterZones();
  placerCartesACheval();
  tracerTousLesFlux();
  tracerEchanges();
}

/** Les zones de texte des cartes s'ajustent à leur contenu (pas d'ascenseur). */
function ajusterZones() {
  racine.querySelectorAll('.carte__texte').forEach((z) => {
    z.style.height = 'auto';
    z.style.height = z.scrollHeight + 'px';
  });
}

/** Centre les cartes « à cheval » sur la frontière entre leurs deux couloirs.
    Le décalage est mémorisé sur la carte pour que les flèches le suivent. */
function placerCartesACheval() {
  racine.querySelectorAll('[data-cheval]').forEach((carte) => {
    const sens = Number(carte.dataset.cheval);
    const cellule = carte.parentElement;
    const marge = 12;   /* padding vertical de la cellule */
    const decal = sens > 0
      ? cellule.offsetHeight - carte.offsetHeight / 2 - marge
      : -carte.offsetHeight / 2 - marge;
    carte.style.transform = `translateY(${decal}px)`;
    carte.dataset.decalage = String(decal);
  });
}

/** Relie les blocs du logigramme IT en accrochant les bords les plus proches :
    de gauche à droite si le bloc cible est à droite, de bord à bord sinon,
    et par le dessous quand la flèche revient en arrière. */
function tracerEchanges() {
  const grille = document.querySelector('.si__grille');
  const svg = document.querySelector('.si-svg');
  if (!grille || !svg) return;

  const c = client();
  if (!c) return;
  const liens = echangesBlocs(c);
  const boite = (nom) => {
    const el = grille.querySelector('[data-domaine="' + String(nom).replace(/"/g, '\\"') + '"]');
    if (!el) return null;
    let x = 0, y = 0, cur = el;
    while (cur && cur !== grille) { x += cur.offsetLeft; y += cur.offsetTop; cur = cur.offsetParent; }
    return { g: x, d: x + el.offsetWidth, h: y, b: y + el.offsetHeight,
             mx: x + el.offsetWidth / 2, my: y + el.offsetHeight / 2 };
  };

  const chemins = [];
  liens.forEach((l) => {
    const a = boite(l.de), b = boite(l.vers);
    if (!a || !b) return;
    const style = LIENS[l.nature || ''] || LIENS[''];
    let d;
    if (b.g > a.d + 10) {                       /* cible à droite */
      const k = Math.max(24, (b.g - a.d) / 2);
      d = `M${a.d},${a.my} C${a.d + k},${a.my} ${b.g - k},${b.my} ${b.g},${b.my}`;
    } else if (b.d < a.g - 10) {                /* cible à gauche */
      const k = Math.max(24, (a.g - b.d) / 2);
      d = `M${a.g},${a.my} C${a.g - k},${a.my} ${b.d + k},${b.my} ${b.d},${b.my}`;
    } else if (b.h > a.b) {                     /* cible dessous */
      const k = Math.max(20, (b.h - a.b) / 2);
      d = `M${a.mx},${a.b} C${a.mx},${a.b + k} ${b.mx},${b.h - k} ${b.mx},${b.h}`;
    } else {                                    /* cible dessus */
      const k = Math.max(20, (a.h - b.b) / 2);
      d = `M${a.mx},${a.h} C${a.mx},${a.h - k} ${b.mx},${b.b + k} ${b.mx},${b.b}`;
    }
    chemins.push(`<path d="${d}" fill="none" stroke="${style.couleur}" stroke-width="1.8"${
      style.tirets ? ` stroke-dasharray="${style.tirets}"` : ''} marker-end="url(#si-${style.marqueur})">
      <title>${e(l.de)} → ${e(l.vers)} · ${l.nb} échange(s) · ${style.libelle}</title></path>`);
  });

  const pointe = (id, couleur) =>
    `<marker id="si-${id}" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
       <path d="M0,0 L6,3 L0,6 z" fill="${couleur}"></path></marker>`;

  svg.style.width = grille.scrollWidth + 'px';
  svg.style.height = grille.offsetHeight + 'px';
  svg.innerHTML = `<defs>
      ${pointe('pointe-neutre', '#A485FE')}
      ${pointe('pointe-auto', '#6733FD')}
      ${pointe('pointe-manuel', '#CE6700')}
    </defs>${chemins.join('')}`;
}

/* ==========================================================================
   SAISIE — un seul point d'entrée, piloté par data-champ
   ========================================================================== */
racine.addEventListener('input', (ev) => {
  const champ = ev.target.dataset && ev.target.dataset.champ;
  if (!champ) return;
  appliquerChamp(champ, ev.target.value);
});

racine.addEventListener('change', (ev) => {
  const champ = ev.target.dataset && ev.target.dataset.champ;
  if (!champ || ev.target.tagName !== 'SELECT') return;
  appliquerChamp(champ, ev.target.value);
});

function appliquerChamp(champ, valeur) {
  const [type, a, b] = champ.split('.');

  /* Le zoom est un réglage d'affichage : rien à enregistrer dans la base. */
  if (type === 'zoom') {
    etat.zoom = Math.min(1, Math.max(0.4, Number(valeur) / 100));
    rendre();
    return;
  }

  /* Ajout d'un support à une étape, choisi dans la liste des outils du site.
     « Autre outil… » demande le nom et l'ajoute aussi aux outils du client,
     pour qu'il soit ensuite proposé sur les autres étapes. */
  if (type === 'support-ajout') {
    if (!valeur) return;
    let nom = valeur;
    let aInscrire = false;
    if (valeur === '__autre__') {
      nom = (window.prompt('Nom du support ou de l\'outil :') || '').trim();
      if (!nom) { rendre(); return; }
      aInscrire = true;
    }
    majBase(({ client: c, proc: p }) => {
      const et = p.etapes[Number(a)];
      if (!et) return;
      const liste = listeSupports(et.supports);
      if (!liste.includes(nom)) liste.push(nom);
      et.supports = liste.join(', ');
      if (aInscrire) {
        c.outils = c.outils || [];
        if (!c.outils.includes(nom)) c.outils.push(nom);
      }
    });
    return;
  }

  majBase(({ client: c, proc: p }) => {
    if (type === 'client') { c[a] = valeur; return; }
    if (type === 'outil') { c.outils[Number(a)] = valeur; return; }
    if (type === 'proc') { p[a] = valeur; return; }

    if (type === 'role') {
      const i = Number(a);
      const avant = p.roles[i];
      p.roles[i] = valeur;
      p.etapes.forEach((et) => {
        if (et.role === avant) et.role = valeur;
        if (et.role2 === avant) et.role2 = valeur;
      });
      p.frictions.forEach((f) => { if (f.role === avant) f.role = valeur; });
      return;
    }
    /* Bandeau de phases : renomme la phase des `span` étapes du groupe d'un coup. */
    if (type === 'phase') {
      const debut = Number(a), span = Number(b);
      for (let k = debut; k < debut + span && k < p.etapes.length; k++) p.etapes[k].phase = valeur;
      return;
    }
    /* Renommage d'un domaine : le classement des outils suit. */
    if (type === 'dom') {
      const si = assurerSI(c);
      const i = Number(a);
      const avant = si.domaines[i];
      si.domaines[i] = valeur;
      Object.keys(si.classement).forEach((o) => {
        if (si.classement[o] === avant) si.classement[o] = valeur;
      });
      if (si.missions && si.missions[avant] !== undefined && avant !== valeur) {
        si.missions[valeur] = si.missions[avant];
        delete si.missions[avant];
      }
      return;
    }

    /* Renommage d'une mission. */
    if (type === 'mission') {
      const si = assurerSI(c);
      const dom = si.domaines[Number(a)];
      if (!dom) return;
      si.missions[dom] = si.missions[dom] || [];
      si.missions[dom][Number(b)] = valeur;
      return;
    }

    /* Changement de domaine d'un outil. Le nom d'outil peut contenir des points,
       on le relit donc depuis la clé complète plutôt que du découpage. */
    if (type === 'classe') {
      const si = assurerSI(c);
      si.classement[champ.slice('classe.'.length)] = valeur;
      return;
    }

    /* Échanges du logigramme IT : la liste déduite est figée à la 1re retouche. */
    if (type === 'si') {
      const si = assurerSI(c);
      const lien = si.liens[Number(a)];
      if (lien) lien[b] = valeur;
      return;
    }
    if (type === 'etape') { p.etapes[Number(a)][b] = valeur; return; }
    if (type === 'friction') { p.frictions[Number(a)][b] = valeur; return; }
    if (type === 'chiffre') { p.chiffres[Number(a)][b] = valeur; return; }
  });
}

/* ==========================================================================
   GLISSER-DÉPOSER — déplacer une étape de couloir et/ou de colonne
   La poignée seule est draggable : le texte des champs reste sélectionnable.
   ========================================================================== */
racine.addEventListener('dragstart', (ev) => {
  const poignee = ev.target.closest('[data-poignee]');
  if (!poignee) return;
  const carte = poignee.closest('[data-index]');
  glisse = Number(poignee.dataset.poignee);
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', String(glisse));
  if (carte) {
    ev.dataTransfer.setDragImage(carte, 24, 20);
    carte.classList.add('flux__carte--glissee');
  }
  const flux = racine.querySelector('.flux');
  if (flux) flux.classList.add('flux--glisse');
});

racine.addEventListener('dragend', () => {
  glisse = null;
  const flux = racine.querySelector('.flux');
  if (flux) flux.classList.remove('flux--glisse');
  racine.querySelectorAll('.flux__carte--glissee').forEach((el) => el.classList.remove('flux__carte--glissee'));
  racine.querySelectorAll('.flux__cellule--cible, .flux__frontiere--cible')
    .forEach((el) => el.classList.remove('flux__cellule--cible', 'flux__frontiere--cible'));
});

racine.addEventListener('dragover', (ev) => {
  if (glisse === null) return;
  const frontiere = ev.target.closest('[data-frontiere]');
  const zone = frontiere || ev.target.closest('[data-cellule]');
  if (!zone) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  racine.querySelectorAll('.flux__cellule--cible, .flux__frontiere--cible').forEach((el) => {
    if (el !== zone) el.classList.remove('flux__cellule--cible', 'flux__frontiere--cible');
  });
  zone.classList.add(frontiere ? 'flux__frontiere--cible' : 'flux__cellule--cible');
});

racine.addEventListener('dragleave', (ev) => {
  const zone = ev.target.closest('[data-frontiere]') || ev.target.closest('[data-cellule]');
  if (zone && !zone.contains(ev.relatedTarget)) {
    zone.classList.remove('flux__cellule--cible', 'flux__frontiere--cible');
  }
});

racine.addEventListener('drop', (ev) => {
  const frontiere = ev.target.closest('[data-frontiere]');
  const cellule = frontiere || ev.target.closest('[data-cellule]');
  if (!cellule || glisse === null) return;
  ev.preventDefault();

  const source = glisse;
  const colonne = Number(frontiere ? frontiere.dataset.frontiere : cellule.dataset.cellule);
  const role = frontiere ? frontiere.dataset.roleHaut : cellule.dataset.roleNom;
  const role2 = frontiere ? frontiere.dataset.roleBas : '';
  glisse = null;

  majBase(({ proc: p }) => {
    const etape = p.etapes[source];
    if (!etape) return;
    if (role != null) etape.role = role;
    /* Déposée sur un couloir : un seul rôle. Sur une frontière : les deux. */
    etape.role2 = role2 && role2 !== role ? role2 : '';
    p.etapes.splice(source, 1);
    /* La cellule d'ajout en fin de couloir vaut « à la fin ». */
    const destination = Math.min(colonne, p.etapes.length);
    p.etapes.splice(destination, 0, etape);
    /* L'étape adopte la phase de sa nouvelle place : sans cela, un simple
       déplacement fragmenterait le bandeau (« Avant J1 | J1 | Avant J1 »). */
    const voisin = p.etapes[destination - 1] || p.etapes[destination + 1];
    if (voisin) etape.phase = voisin.phase || '';
    renumeroter(p);
    return { etapeActive: etape.ordre };
  });
});

/* ==========================================================================
   ACTIONS — un seul point d'entrée, piloté par data-action
   ========================================================================== */
racine.addEventListener('click', (ev) => {
  const cible = ev.target.closest('[data-action]');
  if (!cible) return;
  const action = cible.dataset.action;
  const i = cible.dataset.i != null ? Number(cible.dataset.i) : null;
  const id = cible.dataset.id;
  const actions = ACTIONS[action];
  if (actions) actions(i, id, cible);
});

const ACTIONS = {
  'ouvrir-menu': () => { etat.menu = true; rendre(); },
  'fermer-menu': () => { etat.menu = false; rendre(); },
  'basculer-edition': () => { etat.edition = !etat.edition; etat.etapeActive = null; rendre(); },
  'basculer-tableau': () => { etat.tableau = !etat.tableau; rendre(); },
  'imprimer': () => imprimerDiagnostic(),

  /* Règle le zoom pour que tout le diagramme tienne dans la largeur disponible. */
  'zoom-ajuster': () => {
    const flux = document.querySelector('.flux');
    const defile = document.querySelector('.flux-defile');
    if (!flux || !defile) return;
    const naturelle = flux.getBoundingClientRect().width / (etat.zoom || 1);
    const dispo = defile.clientWidth - 4;
    if (naturelle <= 0) return;
    etat.zoom = Math.min(1, Math.max(0.4, Math.floor((dispo / naturelle) * 20) / 20));
    rendre();
  },

  /* Nature du lien entrant : non qualifié → manuel → automatique → … */
  'basculer-lien': (i) => majBase(({ proc: p }) => {
    const etape = p.etapes[i];
    if (!etape) return;
    const rang = ORDRE_LIENS.indexOf(etape.lien || '');
    etape.lien = ORDRE_LIENS[(rang + 1) % ORDRE_LIENS.length];
  }),

  'choisir-client': (i, id) => {
    const cl = etat.base.find((x) => x.id === id);
    if (!cl) return;
    etat.clientId = cl.id;
    etat.procId = cl.processus[0] ? cl.processus[0].id : null;
    etat.menu = false;
    etat.etapeActive = null;
    persister();
    rendre();
  },
  'choisir-proc': (i, id) => { etat.procId = id; etat.etapeActive = null; rendre(); },
  'selectionner-etape': (i, id, cible) => {
    etat.etapeActive = Number(cible.dataset.ordre);
    rendre();
  },

  /* --- client --- */
  'creer-client': () => majBase(({ base }) => {
    const id = idUnique('nouveau client', base.map((x) => x.id));
    const p = processusVierge([]);
    base.push({ id, nom: 'Nouveau client', site: '', date: dateDuJour(), processus: [p], outils: [], notes: '' });
    return { clientId: id, procId: p.id, menu: false, edition: true, etapeActive: null };
  }),
  'dupliquer-client': () => majBase(({ base, client: c }) => {
    const copie = clone(c);
    copie.id = idUnique(c.id + ' copie', base.map((x) => x.id));
    copie.nom = c.nom + ' (copie)';
    base.push(copie);
    return { clientId: copie.id, procId: copie.processus[0] ? copie.processus[0].id : null, etapeActive: null };
  }),
  'supprimer-client': () => {
    const c = client();
    if (!c) return;
    if (etat.base.length < 2) {
      alert('La base garde au moins un diagnostic. Créez-en un autre avant de supprimer celui-ci.');
      return;
    }
    if (!confirm(`Supprimer définitivement le diagnostic « ${c.nom} » de la base locale ?`)) return;
    majBase(({ base }) => {
      const i = base.findIndex((x) => x.id === c.id);
      base.splice(i, 1);
      const suivant = base[Math.min(i, base.length - 1)];
      return {
        clientId: suivant.id,
        procId: suivant.processus[0] ? suivant.processus[0].id : null,
        etapeActive: null
      };
    });
  },
  'regenerer-id': () => {
    const c = client();
    if (!c) return;
    const pris = etat.base.filter((x) => x.id !== c.id).map((x) => x.id);
    const nouveau = idUnique(c.nom + ' ' + (c.site || ''), pris);
    majBase(({ client: cl }) => { cl.id = nouveau; return { clientId: nouveau }; });
  },
  'ajouter-outil': () => majBase(({ client: c }) => { c.outils = (c.outils || []).concat(['Nouvel outil']); }),
  'supprimer-outil': (i) => majBase(({ client: c }) => { c.outils.splice(i, 1); }),

  /* --- processus --- */
  'ajouter-processus': () => majBase(({ client: c }) => {
    const p = processusVierge(c.processus.map((x) => x.id));
    c.processus.push(p);
    return { procId: p.id, etapeActive: null };
  }),
  'supprimer-processus': () => {
    const c = client(), p = proc();
    if (!c || !p) return;
    if (c.processus.length < 2) { alert('Un diagnostic garde au moins un processus.'); return; }
    if (!confirm(`Supprimer le processus « ${p.nom} » et ses ${p.etapes.length} étape(s) ?`)) return;
    majBase(({ client: cl }) => {
      const i = cl.processus.findIndex((x) => x.id === p.id);
      cl.processus.splice(i, 1);
      const suivant = cl.processus[Math.min(i, cl.processus.length - 1)];
      return { procId: suivant.id, etapeActive: null };
    });
  },

  /* --- rôles --- */
  'ajouter-role': () => majBase(({ proc: p }) => { p.roles.push('Rôle ' + (p.roles.length + 1)); }),
  'monter-role': (i) => majBase(({ proc: p }) => {
    [p.roles[i - 1], p.roles[i]] = [p.roles[i], p.roles[i - 1]];
  }),
  'descendre-role': (i) => majBase(({ proc: p }) => {
    [p.roles[i + 1], p.roles[i]] = [p.roles[i], p.roles[i + 1]];
  }),
  'supprimer-role': (i) => {
    const p = proc();
    if (!p) return;
    if (p.roles.length < 2) {
      alert('Un processus garde au moins un rôle : renommez celui-ci plutôt que de le supprimer.');
      return;
    }
    const role = p.roles[i];
    const nb = p.etapes.filter((et) => et.role === role).length;
    const repli = p.roles.find((r, j) => j !== i);
    if (nb && !confirm(`${nb} étape(s) sont sur le rôle « ${role} ». Les réaffecter à « ${repli} » et supprimer le rôle ?`)) return;
    majBase(({ proc: px }) => {
      px.roles.splice(i, 1);
      const cible = px.roles[0];
      px.etapes.forEach((et) => {
        if (et.role === role) et.role = cible;
        if (et.role2 === role) et.role2 = '';          /* plus de chevauchement possible */
        if (et.role2 === et.role) et.role2 = '';
      });
      px.frictions.forEach((f) => { if (f.role === role) f.role = 'Transverse'; });
    });
  },

  /* --- étapes --- */
  'ajouter-etape': () => majBase(({ proc: p }) => {
    p.etapes.push(etapeVierge(p, p.roles[0] || ''));
    renumeroter(p);
    return { etapeActive: p.etapes.length };
  }),
  /* Ajout depuis le bouton fantôme en fin de couloir : hérite du rôle de la ligne. */
  'ajouter-etape-role': (i, id, cible) => majBase(({ proc: p }) => {
    p.etapes.push(etapeVierge(p, cible.dataset.roleNom || p.roles[0] || ''));
    renumeroter(p);
    return { etapeActive: p.etapes.length };
  }),
  /* Insertion juste après l'étape visée, même rôle et même phase. */
  'inserer-etape': (i) => majBase(({ proc: p }) => {
    const source = p.etapes[i];
    p.etapes.splice(i + 1, 0, {
      ordre: 0,
      role: source ? source.role : (p.roles[0] || ''),
      texte: '',
      phase: source ? (source.phase || '') : '',
      supports: ''
    });
    renumeroter(p);
    return { etapeActive: i + 2 };
  }),
  'gauche-etape': (i) => majBase(({ proc: p }) => {
    [p.etapes[i - 1], p.etapes[i]] = [p.etapes[i], p.etapes[i - 1]];
    renumeroter(p);
    return { etapeActive: i };
  }),
  'droite-etape': (i) => majBase(({ proc: p }) => {
    [p.etapes[i + 1], p.etapes[i]] = [p.etapes[i], p.etapes[i + 1]];
    renumeroter(p);
    return { etapeActive: i + 2 };
  }),
  'supprimer-etape': (i) => majBase(({ proc: p }) => {
    p.etapes.splice(i, 1);
    renumeroter(p);
    return { etapeActive: null };
  }),

  'supprimer-support': (i, id, cible) => majBase(({ proc: p }) => {
    const et = p.etapes[i];
    if (!et) return;
    const liste = listeSupports(et.supports);
    liste.splice(Number(cible.dataset.s), 1);
    et.supports = liste.join(', ');
  }),

  /* --- environnement IT --- */
  'ajouter-mission': (i) => majBase(({ client: c }) => {
    const si = assurerSI(c);
    const dom = si.domaines[i];
    if (!dom) return;
    si.missions[dom] = (si.missions[dom] || []).concat(['Nouvelle mission']);
  }),
  'supprimer-mission': (i, id, cible) => majBase(({ client: c }) => {
    const si = assurerSI(c);
    const dom = si.domaines[i];
    if (!dom || !si.missions[dom]) return;
    si.missions[dom].splice(Number(cible.dataset.k), 1);
  }),
  'ajouter-domaine': () => majBase(({ client: c }) => {
    const si = assurerSI(c);
    let nom = 'Nouveau domaine', n = 2;
    while (si.domaines.includes(nom)) nom = `Nouveau domaine ${n++}`;
    si.domaines.push(nom);
  }),
  'supprimer-domaine': (i) => majBase(({ client: c }) => {
    const si = assurerSI(c);
    const nom = si.domaines[i];
    si.domaines.splice(i, 1);
    Object.keys(si.classement).forEach((o) => {
      if (si.classement[o] === nom) si.classement[o] = DOMAINE_AUTRE;
    });
    if (!si.domaines.includes(DOMAINE_AUTRE)) si.domaines.push(DOMAINE_AUTRE);
  }),
  'ajouter-echange': () => majBase(({ client: c }) => {
    const si = assurerSI(c);
    const outils = outilsDuSite(c);
    si.liens.push({ de: outils[0] || '', vers: outils[1] || outils[0] || '', nature: '', libelle: '' });
  }),
  'supprimer-echange': (i) => majBase(({ client: c }) => {
    const si = assurerSI(c);
    si.liens.splice(i, 1);
  }),
  'rederiver-echanges': () => {
    if (!confirm("Repartir des enchaînements d'étapes des processus ? Vos ajustements sur les échanges seront perdus.")) return;
    majBase(({ client: c }) => { c.si = { liens: deriverEchanges(c) }; });
  },

  /* --- échelles de temps (phases) --- */
  /* Ajouter en bout de frise. Une échelle n'existe que si elle couvre au moins
     une étape : on en crée donc une, vide, prête à être remplie ou à recevoir
     des étapes existantes par glisser-déposer. */
  'ajouter-phase': () => majBase(({ proc: p }) => {
    const etape = etapeVierge(p, p.roles[0] || '');
    etape.phase = nomPhaseLibre(p);
    p.etapes.push(etape);
    renumeroter(p);
    return { etapeActive: p.etapes.length };
  }),
  /* Créer : l'étape visée démarre une nouvelle échelle, qui court jusqu'à la fin
     du groupe auquel elle appartenait. */
  'couper-phase': (i) => {
    const p = proc();
    if (!p) return;
    const et = p.etapes[i];
    if (!et) return;
    const ancienne = et.phase || '';
    if (i === 0 || (p.etapes[i - 1].phase || '') !== ancienne) {
      window.alert("Cette étape ouvre déjà une échelle de temps. Choisissez-en une autre pour couper.");
      return;
    }
    const nom = nomPhaseLibre(p);
    majBase(({ proc: px }) => {
      for (let k = i; k < px.etapes.length && (px.etapes[k].phase || '') === ancienne; k++) {
        px.etapes[k].phase = nom;
      }
    });
  },
  /* Supprimer : les étapes du groupe rejoignent l'échelle précédente (ou la suivante). */
  'supprimer-phase': (i, id, cible) => {
    const span = Number(cible.dataset.span);
    majBase(({ proc: p }) => {
      const avant = i > 0 ? (p.etapes[i - 1].phase || '') : null;
      const apres = (i + span) < p.etapes.length ? (p.etapes[i + span].phase || '') : null;
      const reprise = avant != null ? avant : (apres != null ? apres : '');
      for (let k = i; k < i + span && k < p.etapes.length; k++) p.etapes[k].phase = reprise;
    });
  },

  /* --- frictions et chiffres --- */
  'ajouter-friction': () => majBase(({ proc: p }) => { p.frictions.push({ role: 'Transverse', texte: '' }); }),
  'supprimer-friction': (i) => majBase(({ proc: p }) => { p.frictions.splice(i, 1); }),
  'ajouter-chiffre': () => majBase(({ proc: p }) => { p.chiffres.push({ valeur: '', libelle: '' }); }),
  'supprimer-chiffre': (i) => majBase(({ proc: p }) => { p.chiffres.splice(i, 1); }),

  /* --- exports --- */
  'exporter-json': () => {
    const c = client();
    if (!c) return;
    telecharger(`diagnostic-${c.id}.json`,
      JSON.stringify(paquetJson([c]), null, 2), 'application/json');
  },
  'exporter-base-json': () => {
    if (!etat.base.length) return;
    telecharger('diagnostic-os-base.json',
      JSON.stringify(paquetJson(etat.base), null, 2), 'application/json');
  },
  'exporter-fichier': () => telecharger('clients-data.js', genererFichier(), 'text/javascript'),

  /* --- import --- */
  'importer-json': (i, id, cible) => {
    const remplacer = cible.dataset.mode === 'remplacer';
    lireFichierJson((donnees) => {
      const courant = client();

      /* En remplacement, l'identifiant du client courant se libère : le
         diagnostic entrant le reprendra et gardera sa place dans la liste. */
      const pris = etat.base
        .map((x) => x.id)
        .filter((x) => !(remplacer && courant && x === courant.id));

      const clients = clientsDuJson(donnees, pris);
      if (!clients.length) {
        alert("Aucun diagnostic exploitable dans ce fichier.");
        return;
      }

      if (remplacer && courant && clients.length === 1) {
        const avant = totauxClient(courant);
        if (avant.etapes + avant.frictions > 0 && !confirm(
          `« ${courant.nom} » contient déjà ${avant.etapes} étape(s) et `
          + `${avant.frictions} friction(s).\n\nLes remplacer par le contenu du fichier ?`
        )) return;

        const arrive = clients[0];
        arrive.id = courant.id;
        majBase(({ base }) => {
          base[base.indexOf(courant)] = arrive;
          return {
            procId: arrive.processus[0] ? arrive.processus[0].id : null,
            menu: false,
            etapeActive: null
          };
        });
        return;
      }

      if (remplacer && clients.length > 1) {
        alert(`Le fichier contient ${clients.length} diagnostics : ils sont ajoutés `
          + `à la base au lieu de remplacer un seul diagnostic.`);
      }

      majBase(({ base }) => {
        clients.forEach((x) => base.push(x));
        const premier = clients[0];
        return {
          clientId: premier.id,
          procId: premier.processus[0] ? premier.processus[0].id : null,
          menu: false,
          edition: false,
          etapeActive: null
        };
      });
    });
  },
  'reinitialiser': () => {
    if (!confirm("Abandonner toutes les modifications locales et repartir des données d'origine ?")) return;
    try { localStorage.removeItem(CLE_BASE); localStorage.removeItem(CLE_CLIENT); } catch (err) {}
    etat.base = trierBase(clone(BASE_SOURCE));
    const premier = etat.base[0];
    etat.clientId = premier ? premier.id : null;
    etat.procId = premier && premier.processus[0] ? premier.processus[0].id : null;
    etat.menu = false;
    etat.etapeActive = null;
    rendre();
  }
};

/* ==========================================================================
   EXPORTS
   ========================================================================== */
function telecharger(nom, contenu, type) {
  const blob = new Blob([contenu], { type: type || 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/** Régénère clients-data.js dans le format du fichier source. */
function genererFichier() {
  const s = (v) => JSON.stringify(v == null ? '' : String(v));
  const enLigne = (o, cles) => '{ ' + cles
    .filter((k) => o[k] !== undefined)
    .map((k) => k + ': ' + (typeof o[k] === 'number' ? o[k] : s(o[k])))
    .join(', ') + ' }';
  const bloc = (items, cles, marge) => items.map((it, i) =>
    marge + enLigne(it, cles) + (i < items.length - 1 ? ',' : ''));

  const L = [
    '// Base locale des diagnostics — un objet par client.',
    '// Chaque étape : { ordre, role, texte, phase, supports }  → ordre = colonne dans le diagramme de flux.',
    '// supports : chaîne libre, séparée par des virgules (« Excel, papier »).',
    '// role2 : second rôle impliqué → la carte chevauche les deux couloirs.',
    '// lien : nature de la flèche entrante — "auto", "manuel" ou vide.',
    '// Chaque friction : { role, texte }  → "Transverse" si la friction ne porte pas sur un rôle unique.',
    '// Généré par diagnostic-os.html (Menu → Exporter clients-data.js).',
    '',
    'export const CLIENTS = ['
  ];

  etat.base.forEach((c, ci) => {
    L.push('  {');
    L.push('    id: ' + s(c.id) + ',');
    L.push('    nom: ' + s(c.nom) + ',');
    L.push('    site: ' + s(c.site) + ',');
    L.push('    date: ' + s(c.date) + ',');
    L.push('    processus: [');
    c.processus.forEach((p, pi) => {
      L.push('      {');
      L.push('        id: ' + s(p.id) + ',');
      L.push('        nom: ' + s(p.nom) + ',');
      L.push('        soustitre: ' + s(p.soustitre) + ',');
      L.push('        roles: [' + p.roles.map(s).join(', ') + '],');
      L.push('        etapes: [');
      L.push(...bloc(p.etapes, ['ordre', 'role', 'role2', 'texte', 'phase', 'supports', 'lien'], '          '));
      L.push('        ],');
      L.push('        frictions: [');
      L.push(...bloc(p.frictions, ['role', 'texte'], '          '));
      L.push('        ],');
      L.push('        chiffres: [');
      L.push(...bloc(p.chiffres, ['valeur', 'libelle'], '          '));
      L.push('        ]');
      L.push('      }' + (pi < c.processus.length - 1 ? ',' : ''));
    });
    L.push('    ],');
    L.push('    outils: [' + (c.outils || []).map(s).join(', ') + '],');
    if (c.si && Array.isArray(c.si.liens)) {
      L.push('    si: {');
      L.push('      domaines: [' + (c.si.domaines || []).map(s).join(', ') + '],');
      L.push('      classement: ' + JSON.stringify(c.si.classement || {}) + ',');
      L.push('      missions: ' + JSON.stringify(c.si.missions || {}) + ',');
      L.push('      liens: [');
      L.push(...bloc(c.si.liens, ['de', 'vers', 'nature', 'libelle'], '        '));
      L.push('      ]');
      L.push('    },');
    }
    L.push('    notes: ' + s(c.notes || ''));
    L.push('  }' + (ci < etat.base.length - 1 ? ',' : ''));
  });
  L.push('];');
  return L.join('\n') + '\n';
}

/* ==========================================================================
   IMPRESSION
   Le document est monté à l'écran avant d'appeler window.print() : c'est la
   seule façon de mesurer les diagrammes, puisqu'un conteneur masqué n'a ni
   largeur ni position. Il est posé à la largeur exacte de la page, donc ce
   qu'on mesure est déjà ce qui sera imprimé.
   ========================================================================== */

/* Le document est composé sur un canevas plus large que la feuille, puis réduit
   d'un seul coup à l'impression. Composer directement à la taille du papier
   étranglait les diagrammes : ils sont larges, et c'est la largeur qui commande.
   En donnant 1450 px de large au canevas, chaque diagramme tient à une échelle
   bien plus lisible, et la réduction finale ramène le tout à la feuille.

   1031 x 701 px = surface utile d'une A4 paysage (297 x 210 mm moins 12 mm de
   marge) à 96 dpi. Deux pixels de moins en hauteur pour absorber les arrondis
   plutôt que déborder d'un cheveu sur la page suivante. */
const LARGEUR_FEUILLE = 1031;
const HAUTEUR_FEUILLE = 701;
const LARGEUR_CANEVAS = 1450;
const ECHELLE_IMPRESSION = LARGEUR_FEUILLE / LARGEUR_CANEVAS;
const HAUTEUR_CANEVAS = Math.floor(HAUTEUR_FEUILLE / ECHELLE_IMPRESSION);

/** Réduit chaque diagramme jusqu'à ce que sa page tienne dans le canevas.
    On resserre par mesures successives plutôt que par calcul : la hauteur d'un
    diagramme dépend du retour à la ligne dans les cartes, qu'un modèle
    prédirait mal. La page elle-même n'est jamais zoomée — `scrollHeight` ignore
    le zoom porté par l'élément mesuré, une boucle dessus ne converge pas. */
function ajusterFluxImpression() {
  document.querySelectorAll('.principal--impression .page-impression').forEach((page) => {
    const flux = page.querySelector('.flux');
    if (!flux) return;
    const defile = flux.parentElement;

    flux.style.zoom = 1;
    let z = 1;
    if (defile && flux.scrollWidth > 0 && flux.scrollWidth > defile.clientWidth) {
      z = defile.clientWidth / flux.scrollWidth;
      flux.style.zoom = z;
    }
    for (let i = 0; i < 10 && page.scrollHeight > HAUTEUR_CANEVAS && z > 0.25; i++) {
      z = Math.max(0.25, z * (HAUTEUR_CANEVAS / page.scrollHeight) * 0.99);
      flux.style.zoom = z;
    }
    flux.style.zoom = Math.max(0.25, Math.floor(z * 100) / 100);
  });
  tracerTousLesFlux();
  tracerEchanges();
}

function entrerImpression() {
  etat.impression = true;
  rendre();
  ajusterFluxImpression();
}

function sortirImpression() {
  if (!etat.impression) return;
  etat.impression = false;
  rendre();
}

function imprimerDiagnostic() {
  if (!client()) return;
  entrerImpression();

  const fin = () => {
    window.removeEventListener('afterprint', fin);
    sortirImpression();
  };
  window.addEventListener('afterprint', fin);

  /* Une frame pour laisser la mise en page se poser avant la capture. */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    window.print();
    /* Safari n'émet pas toujours afterprint : filet de sécurité. */
    setTimeout(fin, 1000);
  }));
}

/* ==========================================================================
   JSON — EXPORT FIDÈLE ET RÉINJECTION
   Le JSON exporté contient le client entier (identifiant, processus, outils,
   notes, environnement IT) : réinjecté, il reconstitue le diagnostic à
   l'identique. `totaux` et `exporte_le` sont là pour la lecture humaine et
   sont ignorés à l'import.

   À l'import on ne fait jamais confiance au fichier : rien n'est adopté tel
   quel. Chaque champ est recopié dans la forme attendue, les entrées vides
   sont écartées, les identifiants sont réattribués s'ils sont déjà pris. Un
   fichier bancal donne un diagnostic incomplet, jamais une base corrompue.
   ========================================================================== */
const FORMAT_JSON = 'diagnostic-os';
const VERSION_JSON = 1;

const net = (v) => (v == null ? '' : String(v)).trim();

/** Une liste de supports peut arriver en tableau ou en chaîne : on range en chaîne. */
const enChaineListe = (v) => (Array.isArray(v)
  ? v.map(net).filter(Boolean).join(', ')
  : net(v));

function totauxClient(c) {
  return {
    processus: c.processus.length,
    etapes: c.processus.reduce((n, p) => n + p.etapes.length, 0),
    frictions: c.processus.reduce((n, p) => n + p.frictions.length, 0)
  };
}

function paquetJson(clients) {
  const liste = clients.map(clone);
  return {
    format: FORMAT_JSON,
    version: VERSION_JSON,
    exporte_le: new Date().toISOString(),
    totaux: liste.length === 1
      ? totauxClient(liste[0])
      : { clients: liste.length },
    clients: liste
  };
}

function normaliserEtape(brut) {
  if (!brut || typeof brut !== 'object') return null;
  const role = net(brut.role);
  const texte = net(brut.texte);
  if (!role && !texte) return null;               /* ligne vide : rien à poser */

  const et = { ordre: 0, role, texte, phase: net(brut.phase) };
  const role2 = net(brut.role2);
  if (role2 && role2 !== role) et.role2 = role2;
  const supports = enChaineListe(brut.supports);
  if (supports) et.supports = supports;
  const lien = net(brut.lien);
  if (lien && ORDRE_LIENS.includes(lien)) et.lien = lien;
  return et;
}

function normaliserProcessus(brut, pris) {
  if (!brut || typeof brut !== 'object') return null;

  const etapes = (Array.isArray(brut.etapes) ? brut.etapes : [])
    .map(normaliserEtape).filter(Boolean);
  etapes.forEach((et, i) => { et.ordre = i + 1; });

  /* Les couloirs du diagramme sont bâtis sur `roles` : tout rôle cité par une
     étape doit y figurer, sinon la carte n'a aucune ligne où se poser. */
  const roles = [];
  const noterRole = (r) => {
    const v = net(r);
    if (v && !roles.includes(v)) roles.push(v);
  };
  (Array.isArray(brut.roles) ? brut.roles : []).forEach(noterRole);
  etapes.forEach((et) => { noterRole(et.role); noterRole(et.role2); });

  const frictions = (Array.isArray(brut.frictions) ? brut.frictions : [])
    .map((f) => (f && typeof f === 'object'
      ? { role: net(f.role) || 'Transverse', texte: net(f.texte) }
      : null))
    .filter((f) => f && f.texte);

  const chiffres = (Array.isArray(brut.chiffres) ? brut.chiffres : [])
    .map((x) => (x && typeof x === 'object'
      ? { valeur: net(x.valeur), libelle: net(x.libelle) }
      : null))
    .filter((x) => x && (x.valeur || x.libelle));

  const nom = net(brut.nom) || 'Processus importé';
  return {
    id: idUnique(net(brut.id) || nom, pris),
    nom,
    soustitre: net(brut.soustitre),
    roles: roles.length ? roles : ['RH'],
    etapes,
    frictions,
    chiffres
  };
}

/** Environnement IT. Absent du fichier → on laisse `si` vide : l'app le
    reconstruira par déduction au premier affichage (assurerSI). */
function normaliserSI(brut) {
  if (!brut || typeof brut !== 'object') return null;
  const si = {};

  if (Array.isArray(brut.domaines)) {
    si.domaines = brut.domaines.map(net).filter(Boolean);
  }
  if (brut.classement && typeof brut.classement === 'object') {
    si.classement = {};
    Object.keys(brut.classement).forEach((k) => {
      const outil = net(k), domaine = net(brut.classement[k]);
      if (outil && domaine) si.classement[outil] = domaine;
    });
  }
  if (brut.missions && typeof brut.missions === 'object') {
    si.missions = {};
    Object.keys(brut.missions).forEach((k) => {
      const domaine = net(k), liste = brut.missions[k];
      if (domaine && Array.isArray(liste)) {
        si.missions[domaine] = liste.map(net).filter(Boolean);
      }
    });
  }
  if (Array.isArray(brut.liens)) {
    si.liens = brut.liens
      .map((l) => (l && typeof l === 'object' ? {
        de: net(l.de),
        vers: net(l.vers),
        nature: net(l.nature),
        libelle: net(l.libelle),
        nb: Number(l.nb) || 0
      } : null))
      .filter((l) => l && l.de && l.vers);
  }
  return Object.keys(si).length ? si : null;
}

function normaliserClient(brut, pris) {
  if (!brut || typeof brut !== 'object') return null;

  /* `client` en chaîne : ancien format d'export, où le nom était à plat. */
  const nom = net(brut.nom) || net(brut.client) || 'Diagnostic importé';

  const idsProc = [];
  const processus = [];
  (Array.isArray(brut.processus) ? brut.processus : []).forEach((pb) => {
    const p = normaliserProcessus(pb, idsProc);
    if (!p) return;
    idsProc.push(p.id);
    processus.push(p);
  });
  if (!processus.length) processus.push(processusVierge([]));

  const c = {
    id: idUnique(net(brut.id) || nom, pris),
    nom,
    site: net(brut.site),
    date: net(brut.date) || net(brut.date_visite) || dateDuJour(),
    processus,
    outils: (Array.isArray(brut.outils) ? brut.outils : []).map(net).filter(Boolean),
    notes: net(brut.notes)
  };
  const si = normaliserSI(brut.si);
  if (si) c.si = si;
  return c;
}

/** Accepte les quatre formes rencontrées : paquet `{clients:[…]}`, paquet
    `{client:{…}}`, tableau nu de clients, ou client seul (dont l'ancien
    export à plat, reconnaissable à son `processus` de premier niveau). */
function clientsDuJson(donnees, pris) {
  /* Sans l'un de ces champs, l'objet n'a rien d'un diagnostic : mieux vaut le
     refuser que fabriquer un client vide à partir d'un fichier sans rapport. */
  const ressembleAUnClient = (o) => !!o && typeof o === 'object'
    && ['processus', 'nom', 'client', 'site', 'outils'].some((k) => o[k] !== undefined);

  let bruts = [];
  if (Array.isArray(donnees)) {
    bruts = donnees;
  } else if (donnees && typeof donnees === 'object') {
    if (Array.isArray(donnees.clients)) bruts = donnees.clients;
    else if (donnees.client && typeof donnees.client === 'object') bruts = [donnees.client];
    else if (ressembleAUnClient(donnees)) bruts = [donnees];
  }

  const dejaPris = pris.slice();
  const out = [];
  bruts.forEach((b) => {
    const c = normaliserClient(b, dejaPris);
    if (!c) return;
    dejaPris.push(c.id);
    out.push(c);
  });
  return out;
}

/** Sélecteur de fichier jetable : `#racine` est réécrit à chaque rendu, un
    <input> posé dans le balisage n'y survivrait pas. */
function lireFichierJson(surSucces) {
  const champ = document.createElement('input');
  champ.type = 'file';
  champ.accept = 'application/json,.json';
  champ.addEventListener('change', () => {
    const fichier = champ.files && champ.files[0];
    if (!fichier) return;
    const lecteur = new FileReader();
    lecteur.onload = () => {
      let donnees;
      try {
        donnees = JSON.parse(lecteur.result);
      } catch (err) {
        alert("Fichier illisible : ce n'est pas du JSON valide.");
        return;
      }
      surSucces(donnees);
    };
    lecteur.onerror = () => alert('Lecture du fichier impossible.');
    lecteur.readAsText(fichier);
  });
  champ.click();
}

/* ==========================================================================
   DÉMARRAGE
   ========================================================================== */
(function demarrer() {
  let base = clone(BASE_SOURCE);
  try {
    const brut = localStorage.getItem(CLE_BASE);
    if (brut) {
      const lu = JSON.parse(brut);
      if (Array.isArray(lu) && lu.length) base = lu;
    }
  } catch (err) { /* données locales illisibles : on repart de la source */ }

  etat.base = trierBase(base);

  let id = null;
  try { id = localStorage.getItem(CLE_CLIENT); } catch (err) {}
  const c = etat.base.find((x) => x.id === id) || etat.base[0];
  etat.clientId = c ? c.id : null;
  etat.procId = c && c.processus[0] ? c.processus[0].id : null;

  rendre();
})();

function redessinerTraces() { tracerTousLesFlux(); tracerEchanges(); }
window.addEventListener('resize', redessinerTraces);
document.fonts && document.fonts.ready.then(redessinerTraces);
</script>
