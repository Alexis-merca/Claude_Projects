<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic OS — Mercateam</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@600&display=swap" rel="stylesheet">

<style>
/* =========================================================================
   1. JETONS — charte Mercateam 2024
   ========================================================================= */
:root {
  --violet:        #6733FD;   /* primary-500 : CTA, liens, états actifs */
  --violet-300:    #8C63FD;   /* hover primaire */
  --violet-200:    #C7B4FE;
  --violet-150:    #D1C2FE;
  --violet-400:    #A485FE;
  --violet-50:     #F0EBFF;   /* wash violet */
  --violet-800:    #2A146A;   /* texte sur wash violet */
  --turquoise:     #2AC6CC;

  --encre:         #2B2B2B;   /* texte principal */
  --gris:          #7B7B7B;   /* texte secondaire */
  --bord:          #D5D5D5;   /* anneaux d'input et de carte */
  --filet:         #EFEFEF;   /* séparateurs */
  --page:          #F7F9FA;   /* fond de page */
  --blanc:         #FFFFFF;
  --blanc-casse:   #FCFCFD;   /* couloir alterné */

  /* Rouge = friction, uniquement. Jamais une force. */
  --rouge:         #E90101;
  --rouge-fonce:   #AD0101;
  --rouge-clair:   #FFD9D1;
  --rouge-anneau:  #FFB3A3;

  --r-chip:   4px;
  --r-petit:  8px;
  --r-carte:  12px;
  --r-pilule: 100px;

  --ombre:    0 2px 8px rgba(0, 0, 0, .08);
  --ombre-lg: 0 8px 32px rgba(0, 0, 0, .12);
  --anneau:   inset 0 0 0 1px var(--bord);

  --ui:      'Overpass', system-ui, -apple-system, sans-serif;
  --titre:   'General Sans', 'Overpass', system-ui, sans-serif;
  --mono:    'Roboto Mono', ui-monospace, monospace;

  --colonne-max: 300px;       /* plafond d'une colonne d'étape (fit-content) */
  --couloir: 200px;           /* largeur de la colonne des rôles */
}

/* =========================================================================
   2. BASE
   ========================================================================= */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--page);
  color: var(--encre);
  font: 400 15px/1.4 var(--ui);
  -webkit-font-smoothing: antialiased;
}

h1, h2 { margin: 0; font-family: var(--titre); font-weight: 600; }
h1 { font-size: 44px; line-height: 1.1; }
h2 { font-size: 30px; line-height: 1.15; }

button { font-family: var(--ui); }
input, textarea, select { font-family: var(--ui); }
textarea { resize: vertical; }

.libelle {
  font: 600 12px/1 var(--ui);
  color: var(--gris);
  letter-spacing: .12em;
  text-transform: uppercase;
}
.libelle--large { font-size: 13px; letter-spacing: .14em; }
.sourdine { color: var(--gris); }
.mono { font-family: var(--mono); }

/* =========================================================================
   3. BOUTONS
   ========================================================================= */
.bouton {
  border: none;
  border-radius: var(--r-pilule);
  font: 600 15px/1 var(--ui);
  padding: 11px 20px;
  cursor: pointer;
  transition: background .15s, color .15s, box-shadow .15s;
  white-space: nowrap;
}
.bouton--primaire { background: var(--violet); color: var(--blanc); }
.bouton--primaire:hover { background: var(--violet-300); }
.bouton--primaire:active { background: var(--violet-800); }

.bouton--secondaire { background: var(--page); box-shadow: var(--anneau); color: var(--encre); }
.bouton--secondaire:hover { background: var(--violet-50); }

.bouton--sombre { background: var(--violet-800); color: var(--blanc); }
.bouton--sombre:hover { background: var(--violet); }

.bouton--mini {
  background: var(--violet-50);
  color: var(--violet);
  font-size: 13px;
  padding: 9px 16px;
}
.bouton--mini:hover { background: var(--violet-150); }

.bouton--danger {
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--rouge-anneau);
  color: var(--rouge-fonce);
  font-size: 14px;
  padding: 11px 18px;
}
.bouton--danger:hover { background: var(--rouge-clair); }

.bouton--carre {
  width: 34px; height: 34px; padding: 0;
  background: var(--page);
  box-shadow: var(--anneau);
  color: var(--gris);
  font: 400 15px/1 var(--ui);
}
.bouton--carre:hover:not(:disabled) { background: var(--violet-50); color: var(--violet); }
.bouton--carre[data-role="supprimer"]:hover { background: var(--rouge-clair); color: var(--rouge-fonce); }
.bouton--carre:disabled { opacity: .35; cursor: default; }

.bouton--clair {
  width: 34px; height: 34px; padding: 0;
  background: rgba(255, 255, 255, .7);
  box-shadow: none;
  color: var(--gris);
  font: 400 15px/1 var(--ui);
}
.bouton--clair:hover { background: var(--blanc); color: var(--rouge-fonce); }

.bouton--ajout-clair {
  background: rgba(255, 255, 255, .7);
  font-size: 13px;
  padding: 9px 16px;
  align-self: flex-start;
}
.bouton--ajout-clair:hover { background: var(--blanc); }
.panneau--frictions .bouton--ajout-clair { color: var(--rouge-fonce); }
.panneau--chiffres  .bouton--ajout-clair { color: var(--violet); }

.bouton--retirer {
  width: 22px; height: 22px; padding: 0;
  background: transparent;
  color: var(--gris);
  font: 400 15px/1 var(--ui);
  border-radius: var(--r-pilule);
  border: none;
  cursor: pointer;
}
.bouton--retirer:hover { background: var(--rouge-clair); color: var(--rouge-fonce); }

/* =========================================================================
   4. CHAMPS
   ========================================================================= */
.champ, .zone, .selecteur {
  width: 100%;
  border: none;
  border-radius: var(--r-petit);
  background: var(--blanc);
  box-shadow: var(--anneau);
  padding: 9px 12px;
  font: 400 15px/1.4 var(--ui);
  color: var(--encre);
  outline: none;
  transition: box-shadow .15s;
}
.champ:focus, .zone:focus, .selecteur:focus { box-shadow: inset 0 0 0 1px var(--violet); }
.selecteur { cursor: pointer; }

.champ--valeur { font: 700 17px/1.2 var(--mono); color: var(--violet); }

.zone--claire {
  background: rgba(255, 255, 255, .75);
  box-shadow: inset 0 0 0 1px rgba(173, 1, 1, .18);
}
.zone--claire:focus { box-shadow: inset 0 0 0 1px var(--rouge); }

.champ-nu {
  width: 130px;
  border: none;
  background: transparent;
  font: 400 15px/1.3 var(--ui);
  color: var(--encre);
  outline: none;
}

.groupe { display: flex; flex-direction: column; gap: 7px; }

/* =========================================================================
   5. BARRE SUPÉRIEURE ET TIROIR
   ========================================================================= */
.barre {
  position: sticky; top: 0; z-index: 40;
  height: 64px;
  background: var(--blanc);
  box-shadow: 0 1px 0 var(--filet);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; gap: 24px;
}
.barre__bloc { display: flex; align-items: center; gap: 16px; }
.barre__logo { width: 190px; height: 27px; display: block; }
.barre__logo svg { width: 100%; height: 100%; display: block; }
.barre__filet { width: 1px; height: 24px; background: var(--filet); }
.barre__contexte { display: flex; align-items: center; gap: 6px; font: 500 15px/1.3 var(--ui); color: var(--gris); }

.burger {
  width: 40px; height: 40px;
  border: none; border-radius: var(--r-pilule);
  background: var(--violet-50);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  cursor: pointer;
}
.burger:hover { background: var(--violet-150); }
.burger span { display: block; width: 16px; height: 2px; border-radius: var(--r-pilule); background: var(--violet); }

.puce-edition {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 14px; border-radius: var(--r-pilule);
  background: var(--violet-50); color: var(--violet-800);
  font: 600 14px/1.3 var(--ui);
}
.puce-edition::before {
  content: ''; width: 8px; height: 8px;
  border-radius: var(--r-pilule); background: var(--violet);
}

.voile { position: fixed; inset: 0; z-index: 50; background: rgba(43, 43, 43, .45); border: none; }

.tiroir {
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 60;
  width: 400px; background: var(--blanc);
  box-shadow: var(--ombre-lg);
  display: flex; flex-direction: column;
}
.tiroir__entete {
  height: 64px; padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--filet);
}
.tiroir__corps { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.tiroir__pied { padding: 24px; border-top: 1px solid var(--filet); display: flex; flex-direction: column; gap: 12px; }
.tiroir__fermer {
  width: 36px; height: 36px; border: none; border-radius: var(--r-pilule);
  background: var(--page); color: var(--encre); font: 400 20px/1 var(--ui); cursor: pointer;
}
.tiroir__fermer:hover { background: var(--violet-50); }

.fiche-client {
  border: none; text-align: left; cursor: pointer;
  border-radius: var(--r-carte); padding: 14px 16px;
  background: var(--page); color: var(--encre);
  box-shadow: inset 0 0 0 1px var(--filet);
  display: flex; flex-direction: column; gap: 4px;
}
.fiche-client:hover { box-shadow: inset 0 0 0 1px var(--violet-200); }
.fiche-client--actif {
  background: var(--violet-50); color: var(--violet-800);
  box-shadow: inset 0 0 0 1px var(--violet-400);
}
.fiche-client__nom { font: 600 16px/1.3 var(--ui); }
.fiche-client__meta { font: 400 14px/1.3 var(--ui); opacity: .7; }

/* =========================================================================
   6. STRUCTURE DE PAGE
   ========================================================================= */
.principal {
  width: 100%; max-width: 2400px; margin: 0 auto;
  padding: 40px clamp(16px, 2.5vw, 40px) 72px;
  display: flex; flex-direction: column; gap: 32px;
}
.section { display: flex; flex-direction: column; gap: 24px; }
.section--synthese { padding-top: 16px; border-top: 1px solid var(--filet); }

.carte {
  background: var(--blanc);
  border-radius: var(--r-carte);
  box-shadow: var(--ombre);
  padding: 28px 30px;
  display: flex; flex-direction: column; gap: 22px;
}
.carte--flux { padding: 24px 0 8px; gap: 0; }

.grille-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grille-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }
.grille-analyse { display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; align-items: start; }
.rangee { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rangee--pied { padding-top: 4px; border-top: 1px solid var(--filet); }
.pousse-droite { margin-left: auto; }

/* --- en-tête du diagnostic --- */
.entete {
  background: var(--blanc); border-radius: var(--r-carte); box-shadow: var(--ombre);
  padding: 36px 40px;
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 40px; flex-wrap: wrap;
}
.entete__titre { display: flex; flex-direction: column; gap: 12px; }
.entete__sur-titre { font: 600 14px/1 var(--ui); color: var(--violet); letter-spacing: .14em; text-transform: uppercase; }
.entete__kpis { display: flex; gap: 32px; }
.kpi { display: flex; flex-direction: column; gap: 6px; }
.kpi__valeur { font: 700 34px/1 var(--mono); color: var(--violet); }
.kpi__valeur--friction { color: var(--rouge); }
.kpi__libelle { font: 400 15px/1.3 var(--ui); color: var(--gris); }

.pilule {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 14px; border-radius: var(--r-pilule);
  font: 500 15px/1.3 var(--ui);
}
.pilule--violet { background: var(--violet-50); color: var(--violet-800); font-weight: 600; }
.pilule--contour { background: var(--page); box-shadow: var(--anneau); color: var(--encre); }

/* --- onglets de processus --- */
.onglets {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  border-bottom: 1px solid var(--filet);
}
.onglet {
  border: none; cursor: pointer; background: transparent;
  padding: 12px 18px;
  font: 600 16px/1.3 var(--ui); color: var(--gris);
}
.onglet:hover { color: var(--encre); }
.onglet--actif { color: var(--violet); box-shadow: inset 0 -3px 0 var(--violet); }

/* =========================================================================
   7. DIAGRAMME DE FLUX
   Une seule grille pour tout le diagramme : ligne 1 = frise temporelle,
   puis une ligne par rôle. C'est ce qui permet à une carte de chevaucher
   deux couloirs (grid-row: span 2).
   Colonnes en fit-content() : chaque étape ne prend que la largeur de son
   texte, plafonnée — d'où beaucoup moins de défilement horizontal.
   ========================================================================= */
.flux__entete {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px 16px; gap: 16px; flex-wrap: wrap;
}
.flux-defile { overflow-x: auto; padding: 14px 24px 16px 0; }

.flux {
  min-width: min-content;
  display: grid;
  position: relative;
  align-items: stretch;
}

/* fond du couloir, tiré sur toute la largeur de la grille */
.flux__bande { z-index: 0; background: var(--blanc); border-top: 1px solid var(--filet); }
.flux__bande--paire { background: var(--blanc-casse); }

.flux-svg { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; overflow: visible; }
/* Les flèches visibles restent sous les cartes (z-index 2), mais les zones de
   clic doivent passer AU-DESSUS des cellules (z-index 3) : sinon la cellule
   intercepte le clic et la flèche n'est jamais atteinte. D'où deux calques. */
.flux-svg--cibles { z-index: 5; }
/* chemin transparent élargi : cible de clic confortable sur la flèche */
.fleche-cible { pointer-events: stroke; cursor: pointer; }

/* --- frise temporelle --- */
.flux__phase {
  position: relative;
  margin: 0 0 10px; padding: 7px 12px;
  border-radius: var(--r-petit);
  background: var(--violet-50); color: var(--violet-800);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  z-index: 3;
}
.flux__phase--vide { background: transparent; }
.flux__phase--coupe { border-left: 1px dashed var(--violet-200); }
.flux__phase-libelle {
  font: 600 12px/1.2 var(--ui); letter-spacing: .12em; text-transform: uppercase; text-align: center;
}
/* bouton d'ajout en bout de frise, aligné sur les bandeaux */
.flux__phase-ajout {
  margin: 0 0 10px; padding: 7px 10px;
  border: 1px dashed var(--violet-200); border-radius: var(--r-petit);
  background: transparent; color: var(--violet);
  font: 600 12px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase;
  cursor: pointer; z-index: 3;
  opacity: .55; transition: opacity .15s, background .15s;
}
.flux__phase-ajout:hover { opacity: 1; background: var(--violet-50); }

/* écart de temps entre deux jalons, posé sur la séparation */
.flux__ecart {
  position: absolute; left: 0; top: -10px; transform: translateX(-50%);
  background: var(--blanc); box-shadow: inset 0 0 0 1px var(--violet-200);
  color: var(--violet); font: 600 11px/1 var(--mono);
  padding: 3px 8px; border-radius: var(--r-pilule);
  white-space: nowrap; z-index: 4;
}

/* --- couloirs et cellules --- */
.flux__etiquette {
  position: sticky; left: 0; z-index: 6;
  display: flex; align-items: center;
  padding: 12px 16px 12px 24px;   /* la marge vit ici, pas sur le conteneur défilant */
}
.flux__cellule {
  z-index: 3;
  padding: 12px 14px;
  display: flex; align-items: stretch;
  min-width: 150px;
}
.flux__cellule--coupe { border-left: 1px dashed var(--violet-200); }

.flux__carte {
  position: relative;   /* repère du bandeau de supports à cheval sur la bordure */
  /* pas de width:100% : sinon la grille ne peut pas mesurer le texte
     et toutes les colonnes retombent sur le plancher de min-width. */
  flex: 1 1 auto; min-width: 0; text-align: left;
  background: var(--blanc); border: none;
  border-radius: var(--r-carte);
  box-shadow: var(--anneau);
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 8px;
}
/* Carte à cheval : elle garde sa taille d'origine et se centre sur la ligne
   de séparation des deux couloirs (décalage calculé après la mise en page). */
.flux__cellule--cheval { align-items: flex-start; }
.flux__carte--cheval {
  z-index: 4;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .10), inset 0 0 0 1px var(--violet-200);
}
.flux__carte--actif { box-shadow: inset 0 0 0 2px var(--violet); }
.flux__carte-tete {
  display: flex; align-items: flex-start; flex-wrap: wrap; gap: 4px 8px;
}
.flux__carte-phase {
  flex: 1 1 auto; min-width: 0;
  font: 600 12px/1.2 var(--ui); color: var(--violet-400);
  letter-spacing: .1em; text-transform: uppercase;
}
.flux__carte-texte { font: 400 15px/1.4 var(--ui); color: var(--encre); text-wrap: pretty; }

/* --- supports : badges de marque, à cheval sur la bordure haute de la carte --- */
.badge-support { display: block; flex: none; }

.supports-bordure {
  position: absolute; top: 0; left: 12px; z-index: 4;
  transform: translateY(-50%);
  display: inline-flex; align-items: center; gap: 4px;
  max-width: calc(100% - 40px);   /* laisse la place à la poignée */
}
.supports-bordure__reste {
  font: 700 10px/1 var(--mono); color: var(--violet);
  background: var(--blanc); border-radius: var(--r-pilule); padding: 3px 5px;
}
/* En édition, chaque badge porte sa croix de retrait : fond blanc pour rester
   lisible en chevauchant la bordure. */
.support-modif {
  display: inline-flex; align-items: center; gap: 1px;
  padding: 2px 2px 2px 3px;
  border-radius: var(--r-petit);
  background: var(--blanc); box-shadow: var(--anneau);
}
.support-modif:hover { box-shadow: inset 0 0 0 1px var(--violet-200); }

.chip {
  display: inline-flex; align-items: center; justify-self: start; align-self: start;
  padding: 5px 12px; border-radius: var(--r-pilule);
  background: var(--chip-fond, var(--filet)); color: var(--chip-encre, var(--encre));
  font: 600 14px/1.35 var(--ui); white-space: nowrap;
}
.chip--large { padding: 6px 14px; }
.chip--mini { padding: 2px 8px; font-size: 11px; }

.vide {
  margin: 0 24px 20px; padding: 40px;
  border-radius: var(--r-carte);
  background: var(--page); box-shadow: inset 0 0 0 1px var(--filet);
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
}
.vide__titre { font: 600 17px/1.3 var(--ui); }

/* --- barre de zoom --- */
.flux__zoom { display: flex; align-items: center; gap: 10px; }
.flux__zoom input[type="range"] { width: 120px; accent-color: var(--violet); cursor: pointer; }
.flux__zoom-valeur { font: 600 13px/1 var(--mono); color: var(--gris); min-width: 40px; text-align: right; }

/* --- légende des flèches --- */
.flux__legende { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.flux__legende-item { display: inline-flex; align-items: center; gap: 6px; font: 500 13px/1 var(--ui); color: var(--gris); }
.flux__legende-trait { width: 26px; height: 0; border-top-width: 2px; }

/* =========================================================================
   7 bis. ÉDITION DIRECTE SUR LE DIAGRAMME
   ========================================================================= */
.flux--edition .flux__cellule { min-width: 210px; }

/* champ de phase du bandeau : renomme la phase de tout le groupe */
.flux__phase-edition { display: flex; align-items: center; gap: 2px; width: 100%; }
.bouton--puce-claire {
  width: 22px; height: 22px; flex: none; padding: 0;
  border: none; border-radius: var(--r-pilule);
  background: rgba(255, 255, 255, .7);
  color: var(--violet-800); font: 400 13px/1 var(--ui); cursor: pointer;
  opacity: 0; transition: opacity .15s, background .15s, color .15s;
}
.flux__phase:hover .bouton--puce-claire,
.flux__phase-edition:focus-within .bouton--puce-claire { opacity: 1; }
.bouton--puce-claire:hover { background: var(--blanc); color: var(--rouge-fonce); }

.flux__phase-champ {
  width: 100%; min-width: 0; border: none; background: transparent;
  padding: 2px 4px; outline: none;
  border-radius: var(--r-chip);
  text-align: center;
}
.flux__phase-champ {
  font: 600 12px/1.2 var(--ui); color: var(--violet-800);
  letter-spacing: .12em; text-transform: uppercase;
}
.flux__phase-champ:hover { background: rgba(255, 255, 255, .6); }
.flux__phase-champ:focus { background: var(--blanc); box-shadow: inset 0 0 0 1px var(--violet); }
.flux__phase-champ::placeholder { color: var(--violet-400); }

/* couloir de rôle éditable */
.flux__etiquette--edition { flex-direction: column; align-items: stretch; gap: 6px; padding-right: 12px; }
/* Garde l'aspect « pastille de rôle » : le code couleur reste lisible en édition. */
.flux__role-champ {
  width: 100%; border: none; border-radius: var(--r-pilule);
  padding: 5px 12px; outline: none;
  background: var(--chip-fond, var(--filet));
  color: var(--chip-encre, var(--encre));
  font: 600 14px/1.35 var(--ui);
  text-overflow: ellipsis;
}
.flux__role-champ:hover { box-shadow: 0 0 0 1px var(--chip-encre, var(--bord)); }

.bouton--puce {

.flux__carte--edition { position: relative; gap: 6px; padding: 10px 12px 8px; }

.carte__tete { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.carte__poignee {

.carte__texte {
  width: 100%; border: none; background: transparent;
  padding: 2px 4px; outline: none; overflow: hidden;

  font: 400 15px/1.4 var(--ui); color: var(--encre);
  resize: none;

.carte__texte:focus { background: var(--page); box-shadow: inset 0 0 0 1px var(--violet-200); }

.support--modif { gap: 2px; padding-right: 3px; }
.carte__support-choix {
  align-self: flex-start;
  border: none; background: transparent; outline: none; cursor: pointer;
  padding: 2px 4px; border-radius: var(--r-chip);
  font: 600 11px/1.3 var(--ui); color: var(--violet);
  max-width: 100%;
}
.carte__support-choix:hover { background: var(--violet-50); }
.carte__support-choix:focus { background: var(--violet-50); box-shadow: inset 0 0 0 1px var(--violet-200); }

.carte__outils {

  opacity: 0; transition: opacity .15s;

.flux__carte--edition:hover .carte__outils,

.flux__carte--glissee { opacity: .35; }

/* Bandes de dépôt sur la séparation de deux couloirs : inertes au repos,
   activées seulement pendant un glissement. */
.flux__frontiere {
  align-self: end; height: 20px; z-index: 5;
  transform: translateY(10px);
  pointer-events: none; border-radius: var(--r-pilule);

}

  pointer-events: auto;

.flux__ajout {

.flux__cellule:hover .flux__ajout { opacity: 1; }

  padding: 14px 24px 6px; border-top: 1px solid var(--filet);

/* =========================================================================
   8. TABLEAU D'ÉTAPES ET PANNEAUX
   ========================================================================= */
.table-etapes {
  display: grid;
  grid-template-columns: 44px 190px 1fr 190px 128px;
  gap: 10px 12px; align-items: center;
}
.table-etapes__num { font: 700 15px/1 var(--mono); color: var(--gris); text-align: center; }

.table-etapes__actions { display: flex; gap: 6px; }

.roles-ligne { display: grid; grid-template-columns: var(--couloir) 1fr auto; gap: 12px; align-items: center; }

.panneau {
  border-radius: var(--r-carte);
  padding: 24px 26px;
  display: flex; flex-direction: column; gap: 18px;
}
.panneau--frictions { background: var(--rouge-clair); }
.panneau--chiffres { background: var(--violet-50); }
.panneau__titre { font: 700 14px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; }
.panneau--frictions .panneau__titre { color: var(--rouge-fonce); display: flex; align-items: center; gap: 10px; }
.panneau--frictions .panneau__titre::before {

.panneau--chiffres .panneau__titre { color: var(--violet-800); }

.friction-groupe { display: grid; grid-template-columns: 190px 1fr; gap: 16px; align-items: start; }
.friction-groupe__items { display: flex; flex-direction: column; gap: 8px; }
.friction {
  background: rgba(255, 255, 255, .65);
  border-radius: var(--r-petit);
  padding: 10px 14px;
  font: 400 15px/1.4 var(--ui); text-wrap: pretty;
}
.grille-frictions { display: grid; grid-template-columns: 190px 1fr 34px; gap: 10px 12px; align-items: start; }
.grille-chiffres  { display: grid; grid-template-columns: 110px 1fr 34px; gap: 10px 12px; align-items: center; }

.chiffre { display: flex; align-items: baseline; gap: 16px; }
.chiffre__valeur { font: 700 28px/1 var(--mono); color: var(--violet); min-width: 96px; }
.chiffre__libelle { font: 400 15px/1.4 var(--ui); }

/* =========================================================================
   8 bis. ENVIRONNEMENT IT — logigramme des échanges entre outils
   ========================================================================= */
.section--si { padding-top: 16px; border-top: 1px solid var(--filet); }

.si-defile { overflow-x: auto; padding: 8px 24px 20px; }
.si__grille {

}
.si-svg { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }

/* Un bloc par domaine : pastille de titre et badges d'outils en débord sur la
   bordure haute, missions à l'intérieur. */
.si__bloc {
  position: relative; z-index: 1;
  flex: 1 1 300px; max-width: 420px;
  border: 1.5px solid var(--c); border-radius: 14px;
  background: var(--blanc);
  padding: 26px 16px 16px;
}
/* Une seule barre en débord : le titre et les outils se partagent la largeur
   et se réduisent plutôt que de se chevaucher. */
.si__bloc-entete {
  position: absolute; top: 0; left: 14px; right: 14px; transform: translateY(-50%);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.si__bloc-titre {
  flex: 0 1 auto; min-width: 0;
  display: inline-flex; align-items: center; gap: 3px;
  padding: 6px 13px; border-radius: var(--r-petit);
  background: var(--c); color: var(--blanc);

  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.si__bloc-champ {
  border: none; background: transparent; outline: none;

.si__bloc-titre .bouton--retirer { color: rgba(255, 255, 255, .75); }

.si__bloc-outils {
  flex: 0 0 auto;

}

.si__outil {
  display: inline-flex; align-items: center; gap: 5px;

}

.si__bloc-missions { display: flex; flex-wrap: wrap; gap: 7px; }
.si__mission {

  color: color-mix(in srgb, var(--c) 78%, black);

}
.si__bloc-vide { font: italic 400 13px/1.4 var(--ui); color: var(--gris); }

/* missions éditables */
.si__mission--modif { display: inline-flex; align-items: center; gap: 2px; padding: 4px 4px 4px 10px; }

}
.si__mission-ajout {

}

/* classement des outils, en édition */
.si__classement { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px 16px; }
.si__classement-ligne { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 10px; align-items: center; }

.si__ligne {
  display: grid; grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr) 150px minmax(0, 1.4fr) 34px;
  gap: 10px; align-items: center;
}
/* En lecture, les paires outil→outil se serrent sur leur contenu. */
.si__ligne--lecture {

.grille-bilan { display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; align-items: stretch; }
.carte-inventaire { background: var(--blanc); border-radius: var(--r-carte); box-shadow: var(--ombre); padding: 28px 30px; display: flex; flex-direction: column; gap: 20px; }
.nuage { display: flex; flex-wrap: wrap; gap: 10px; }

/* =========================================================================
   10. IMPRESSION / PDF — vue de lecture seule
   ========================================================================= */
/* ==========================================================================
   IMPRESSION — une page par processus, puis l'IT et la synthèse.
   Le document d'impression est monté à l'écran avant d'appeler window.print(),
   à la largeur exacte de la page : les mesures qui servent au zoom de chaque
   diagramme et au tracé des flèches sont donc déjà celles du papier.
   273 mm utiles (A4 paysage moins 12 mm de marge de chaque côté) à 96 dpi.
   ========================================================================== */
.principal--impression {
  width: 1450px; max-width: none; margin: 0 auto; padding: 0; gap: 26px;
}
/* Aucune marge propre : `scrollHeight` doit rendre la hauteur réelle du
   contenu, c'est elle qui pilote l'ajustement à la feuille. */
.page-impression { display: flex; flex-direction: column; gap: 16px; }
.page-impression__bandeau {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding-bottom: 8px; border-bottom: 1px solid var(--filet);
}
.page-impression__client { font-weight: 600; font-size: 14px; color: var(--encre); }
.page-impression__sujet {
  font: 700 11px/1 var(--mono); letter-spacing: .09em;
  text-transform: uppercase; color: var(--gris); white-space: nowrap;
}
.page-impression > .groupe > h2 { margin: 0; }

/* Compaction du bloc d'analyse — le poste le plus lourd de la page : jusqu'à
   585 px mesurés, pour 701 px utiles. Ce qu'on lui reprend revient au
   diagramme. Les frictions passent sur deux colonnes : c'est ce qui coupe le
   plus, sans rien retirer du contenu.
   Ces règles sont portées par le document d'impression, et non par
   `@media print` : les mesures qui pilotent le zoom sont prises à l'écran,
   elles doivent porter sur la mise en page qui sera réellement imprimée. */
.principal--impression .grille-analyse { gap: 14px; }
.principal--impression .panneau { padding: 14px 16px; gap: 10px; }
.principal--impression .friction-groupe { grid-template-columns: 120px 1fr; gap: 10px; }
.principal--impression .friction-groupe__items { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.principal--impression .friction { padding: 7px 10px; font-size: 11.5px; line-height: 1.32; }
.principal--impression .chiffre { gap: 10px; }
.principal--impression .chiffre__valeur { font-size: 20px; min-width: 66px; }
.principal--impression .chiffre__libelle { font-size: 12px; line-height: 1.3; }
.principal--impression .page-impression__bandeau { padding-bottom: 6px; }
.principal--impression h2 { font-size: 24px; }

@media print {
  @page { size: A4 landscape; margin: 12mm; }
  body { background: var(--blanc); }
  .barre, .tiroir, .voile, .onglets, .ne-pas-imprimer { display: none !important; }
  .principal { max-width: none; padding: 0; gap: 20px; }
  /* Le canevas de composition (1450 px) ramené à la largeur utile de la
     feuille (1031 px). Une seule mise à l'échelle, pour tout le document. */
  .principal--impression { width: 1450px; zoom: 0.711; }
  .carte, .entete, .carte-synthese, .carte-inventaire, .panneau, .total-frictions {
    box-shadow: none;
    border: 1px solid var(--filet);
  }
  /* La coupe se décide ici et nulle part ailleurs : un `break-inside: avoid`
     posé sur un conteneur trop large expulsait chaque bloc sur sa propre page. */
  .principal--impression { gap: 0; }
  .page-impression { break-after: page; break-inside: avoid; }
  .page-impression:last-child { break-after: auto; }
  .carte, .si__bloc { break-inside: avoid; }
  .si-defile, .flux-defile { overflow: visible; }
  h2 { break-after: avoid; }
}

/* ==========================================================================

const etat = {
  base: [],
  clientId: null,
  procId: null,
  edition: false,
  menu: false,
  tableau: false,      /* saisie rapide d'appoint, pour la saisie en série */
  impression: false,   /* document d'impression monté : tous les processus rendus */
  zoom: 1,             /* zoom du diagramme (0.4 → 1) */
  etapeActive: null
};

/* Index de l'étape en cours de glissement, le temps du drag & drop. */
let glisse = null;

/* ==========================================================================
   OUTILS
   ========================================================================== */
const e = (v) => String(v == null ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const clone = (v) => JSON.parse(JSON.stringify(v));

function slug(txt) {
  return String(txt || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'sans-nom';
}

function idUnique(souhaite, pris) {
  const racine = slug(souhaite);
  let id = racine, n = 2;
  while (pris.includes(id)) id = racine + '-' + n++;
  return id;
}

function dateDuJour() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
}

/* Renumérote 1..n d'après la position dans le tableau. Jamais de tri ici :
   la position est la source de vérité, sinon un déplacement serait annulé. */
function renumeroter(proc) {
  proc.etapes.forEach((et, i) => { et.ordre = i + 1; });
}

/* Aligne une fois pour toutes l'ordre du tableau sur le champ `ordre` (au chargement). */
function trierBase(base) {
  base.forEach((c) => (c.processus || []).forEach((p) => {
    p.etapes.sort((a, b) => a.ordre - b.ordre);
    renumeroter(p);
  }));
  return base;
}

/** Nom d'échelle de temps encore disponible dans le processus. */
function nomPhaseLibre(proc) {
  const pris = proc.etapes.map((et) => et.phase || '');
  const racine = 'Nouvelle échelle';
  if (!pris.includes(racine)) return racine;
  let n = 2;
  while (pris.includes(`${racine} ${n}`)) n++;
  return `${racine} ${n}`;
}

function processusVierge(pris) {
  return {
    id: idUnique('processus', pris),
    nom: 'Nouveau processus',
    soustitre: '',
    roles: ['RH'],
    etapes: [],
    frictions: [],
    chiffres: []
  };
}

/** Nouvelle étape en fin de flux : hérite de la phase de la précédente. */
function etapeVierge(proc, role) {
  const derniere = proc.etapes[proc.etapes.length - 1];
  return {
    ordre: proc.etapes.length + 1,
    role: role || '',
    texte: '',
    phase: derniere ? (derniere.phase || '') : '',
    supports: ''
  };
}

/* ==========================================================================
   ACCÈS ET PERSISTANCE
   ========================================================================== */
const client = () => etat.base.find((c) => c.id === etat.clientId) || null;

function proc() {
  const c = client();
  if (!c) return null;
  return c.processus.find((p) => p.id === etat.procId) || c.processus[0] || null;
}

function persister() {
  try {
    localStorage.setItem(CLE_BASE, JSON.stringify(etat.base));
    if (etat.clientId) localStorage.setItem(CLE_CLIENT, etat.clientId);
  } catch (err) { /* navigation privée, quota : on continue sans persistance */ }
}

/** Modifie la base puis réaffiche. `fn` reçoit { base, client, proc }. */
function majBase(fn) {
  const suite = fn({ base: etat.base, client: client(), proc: proc() });
  if (suite) Object.assign(etat, suite);
  persister();
  rendre();
}

/* ==========================================================================
   RÔLES ET COULEURS
   ========================================================================== */
function rolesGlobaux() {
  const c = client();
  if (!c) return [];
  const out = [];
  c.processus.forEach((p) => p.roles.forEach((r) => { if (!out.includes(r)) out.push(r); }));
  c.processus.forEach((p) => p.frictions.forEach((f) => {
    if (f.role !== 'Transverse' && !out.includes(f.role)) out.push(f.role);
  }));
  return out;
}

function couleursRole(role) {
  const roles = rolesGlobaux();
  const i = Math.max(0, roles.indexOf(role));
  return role === 'Transverse' ? ['#EFEFEF', '#2B2B2B'] : PASTELS[i % PASTELS.length];
}

function chipRole(role, variante) {
  const [fond, encre] = couleursRole(role);
  const suffixe = variante ? ` chip--${variante}` : '';
  return `<span class="chip${suffixe}" style="--chip-fond:${fond};--chip-encre:${encre}">${e(role)}</span>`;
}

function selecteurRole(champ, valeur, options) {
  const liste = options.includes(valeur) ? options : options.concat([valeur]);
  const opts = liste.map((r) =>
    `<option value="${e(r)}"${r === valeur ? ' selected' : ''}>${e(r) || '—'}</option>`).join('');
  return `<select class="selecteur" data-champ="${e(champ)}">${opts}</select>`;
}

/* Badges de support : pastille à la couleur officielle de la marque + initiale
   du produit, à la façon des badges de type de fichier. Simple Icons ne contient
   plus aucune icône Microsoft et les fichiers officiels ne sont pas
   redistribuables : ces badges sont donc dessinés ici, sans reproduire
   l'artwork des marques, mais avec leurs couleurs pour être reconnus d'un œil. */
const BADGES_SUPPORT = [
  { motifs: ['excel', 'tableur', 'xls', 'csv', 'sheet', 'tableau', 'matrice'],
    fond: '#217346', lettre: 'X' },
  { motifs: ['powerpoint', 'ppt', 'slide', 'presentation', 'diaporama'],
    fond: '#C43E1C', lettre: 'P' },
  { motifs: ['sharepoint', 'onedrive', 'drive', 'teams', 'intranet', 'partage', 'serveur', 'reseau', 'cloud'],
    fond: '#038387', lettre: 'S' },
  { motifs: ['word', 'papier', 'imprime', 'livret', 'carton', 'formulaire', 'checklist',
             'fiche', 'feuille', 'attestation', 'classeur', 'dossier', 'registre', 'cahier'],
    fond: '#2B579A', glyphe: '<rect x="4.2" y="3.4" width="7.6" height="9.2" rx="1" fill="#fff"/><path d="M5.9 5.8h4.2M5.9 8h4.2M5.9 10.2h2.8" stroke="#2B579A" stroke-width="1.1" stroke-linecap="round"/>' },
  { motifs: ['mail', 'email', 'courriel', 'outlook', 'messagerie'],
    fond: '#0F6CBD', glyphe: '<rect x="3" y="4.6" width="10" height="6.8" rx="1" fill="#fff"/><path d="M3.6 5.4L8 8.7l4.4-3.3" stroke="#0F6CBD" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' },
  { motifs: ['video', 'film', 'tuto', 'e-learning', 'elearning'],
    fond: '#D13438', glyphe: '<path d="M6.4 5.1l4.6 2.9-4.6 2.9z" fill="#fff"/>' },
  { motifs: ['oral', 'reunion', 'brief', 'entretien', 'verbal', 'telephone', 'point'],
    fond: '#CA8A04', glyphe: '<path d="M12.6 8.5a2.3 2.3 0 0 1-2.3 2.3H6.9L4.2 12.4V5.6a2.3 2.3 0 0 1 2.3-2.3h3.8a2.3 2.3 0 0 1 2.3 2.3z" fill="#fff"/>' }
];
/* Défaut : fenêtre de navigateur — la plupart des supports nommés sont des applis web. */
const BADGE_DEFAUT = {
  fond: '#5A6ACF',
  glyphe: '<rect x="3" y="4" width="10" height="8" rx="1.2" fill="#fff"/><path d="M3 6.5h10" stroke="#5A6ACF" stroke-width="1.1"/><circle cx="4.7" cy="5.25" r=".55" fill="#5A6ACF"/>'
};

function badgeSupport(nom) {
  const clef = String(nom || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const b = BADGES_SUPPORT.find((x) => x.motifs.some((m) => clef.includes(m))) || BADGE_DEFAUT;
  const dedans = b.glyphe
    ? b.glyphe
    : `<text x="8" y="11.4" text-anchor="middle" fill="#fff"
             font-family="Overpass, sans-serif" font-size="9.5" font-weight="700">${e(b.lettre)}</text>`;
  return `<svg class="badge-support" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
    <rect width="16" height="16" rx="3.6" fill="${b.fond}"/>${dedans}</svg>`;
}

/** Découpe la chaîne « Excel, SharePoint » en étiquettes affichables. */
function listeSupports(brut) {
  return String(brut || '').split(',').map((s) => s.trim()).filter(Boolean);
}

/** Supports de l'étape, en rangée à cheval sur la bordure haute de la carte. */
function bandeauSupports(liste) {
  if (!liste.length) return '';
  const montrees = liste.slice(0, 4);
  const reste = liste.length - montrees.length;
  return `<span class="supports-bordure" title="${e(liste.join(' · '))}">
    ${montrees.map((sup) => badgeSupport(sup)).join('')}
    ${reste ? `<span class="supports-bordure__reste">+${reste}</span>` : ''}
  </span>`;
}

/** Jalon « J-7 », « J1 », « S+2 », « M+3 » → décalage en jours, ou null. */
function jalonEnJours(txt) {
  const m = String(txt || '').trim().match(/^([JSM])\s*([+-]?\d+)?$/i);
  if (!m) return null;
  const n = m[2] ? Number(m[2]) : 0;
  const unite = m[1].toUpperCase();
  return unite === 'J' ? n : unite === 'S' ? n * 7 : n * 30;
}

/** Écart entre deux jalons, dans l'unité la plus lisible. */
function ecartLisible(depuis, vers) {
  if (depuis == null || vers == null) return '';
  const j = vers - depuis;
  if (j === 0) return '';
  const signe = j > 0 ? '+' : '−';
  const a = Math.abs(j);
  if (a % 30 === 0) return `${signe}${a / 30} mois`;
  if (a % 7 === 0) return `${signe}${a / 7} sem`;
  return `${signe}${a} j`;
}

/** Couloirs affichés : les rôles du processus, dédoublonnés, avec leur index réel. */
function rolesCouloirs(p) {
  const out = [];
  p.roles.forEach((r, i) => { if (p.roles.indexOf(r) === i) out.push({ nom: r, iRole: i }); });
  return out;
}

/* Nature du lien entre deux étapes — couleur et style de la flèche. */
const LIENS = {
  '':       { couleur: '#C7B4FE', tirets: '',    marqueur: 'pointe-neutre', libelle: 'non qualifié' },
  'auto':   { couleur: '#6733FD', tirets: '',    marqueur: 'pointe-auto',   libelle: 'automatique' },
  'manuel': { couleur: '#CE6700', tirets: '5 4', marqueur: 'pointe-manuel', libelle: 'manuel' }
};
const ORDRE_LIENS = ['', 'manuel', 'auto'];

/* Barre verticale pointillée : le même signe que la séparation de phase du diagramme. */
const ICONE_COUPURE = `<svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor"
  stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M6 1.5v9" stroke-dasharray="2 2"/></svg>`;

/** Badges retirables, à cheval sur la bordure haute de la carte. */
function bandeauSupportsEdition(j, supports) {
  if (!supports.length) return '';
  return `<span class="supports-bordure supports-bordure--edition">
    ${supports.map((sup, k) => `
      <span class="support-modif" title="${e(sup)}">
        ${badgeSupport(sup)}
        <button class="bouton--retirer" data-action="supprimer-support" data-i="${j}" data-s="${k}"
                title="Retirer ${e(sup)}">×</button>
      </span>`).join('')}
  </span>`;
}

/** Liste déroulante d'ajout, alimentée par les outils déjà relevés sur le site. */
function vueChoixSupport(j, supports) {
  const c = client();
  const outils = (c && c.outils ? c.outils : []).filter((o) => o && !supports.includes(o));
  const options = ['<option value="">＋ support…</option>']

    .concat(['<option value="__autre__">Autre outil…</option>']);
  return `<select class="carte__support-choix" data-champ="support-ajout.${j}"
                  title="Choisir le support ou l'outil utilisé pour cette étape">${options.join('')}</select>`;
}

/** `pArg` permet de composer le diagramme d'un processus qui n'est pas celui
    affiché — le document d'impression les rend tous les quatre d'affilée. */
function vueFlux(pArg) {
  const p = pArg || proc();
  const n = p ? p.etapes.length : 0;
  const ed = etat.edition && !etat.impression;

  const zoom = `
    <div class="flux__zoom ne-pas-imprimer">
      <button class="bouton bouton--mini" data-action="zoom-ajuster" title="Régler le zoom pour tout afficher">Ajuster</button>
      <input type="range" min="40" max="100" step="5" value="${Math.round(etat.zoom * 100)}"
             data-champ="zoom" aria-label="Zoom du diagramme">
      <span class="flux__zoom-valeur">${Math.round(etat.zoom * 100)} %</span>
    </div>`;

  const entete = `
    <div class="flux__entete">
      <span class="libelle libelle--large">Diagramme de flux — l'existant</span>
      <div class="rangee" style="gap:14px">
        ${n ? zoom : ''}
        ${ed ? `<button class="bouton bouton--mini ne-pas-imprimer" data-action="basculer-tableau">${
          etat.tableau ? 'Masquer la saisie rapide' : 'Saisie rapide'}</button>` : ''}
      </div>
    </div>`;

  if (!n) {
    return `
    <div class="carte carte--flux">
      ${entete}
      <div class="vide">
        <span class="vide__titre">Aucune étape pour ce processus</span>
        <span class="sourdine">${ed
          ? 'Ajoutez la première étape avec le bouton ci-dessous.'
          : 'Passez en mode édition et ajoutez la première étape du flux.'}</span>
        ${ed ? '<button class="bouton bouton--mini" data-action="ajouter-etape">+ Première étape</button>' : ''}
      </div>
    </div>`;
  }

  const roles = rolesCouloirs(p);
  const R = roles.length;
  const rangDe = (nom) => {
    const i = roles.findIndex((r) => r.nom === nom);
    return i < 0 ? 0 : i;
  };

  /* Une étape partagée reste dans le couloir de son rôle principal et garde sa
     taille ; elle est simplement décalée pour se centrer sur la frontière avec
     le couloir du second rôle. `cheval` vaut +1 (vers le bas) ou -1 (vers le haut). */
  const emprise = p.etapes.map((et) => {
    const a = rangDe(et.role);
    if (!et.role2 || et.role2 === et.role) return { ligne: a, cheval: 0 };
    return { ligne: a, cheval: rangDe(et.role2) > a ? 1 : -1 };
  });

  /* --- frise temporelle : un bandeau par groupe de phase --- */
  const groupes = [];
  p.etapes.forEach((et, i) => {
    const lab = et.phase || '';
    const dernier = groupes[groupes.length - 1];
    if (dernier && dernier.label === lab) dernier.span += 1;
    else groupes.push({ label: lab, span: 1, debut: i });
  });
  const coupures = groupes.slice(1).map((g) => g.debut);
  /* Écart déduit du libellé lui-même s'il est codé (J-7, J1, S+2, M+3). */
  const jours = groupes.map((g) => jalonEnJours(g.label));

  const frise = groupes.map((g, i) => {
    const ecart = i > 0 ? ecartLisible(jours[i - 1], jours[i]) : '';
    const corps = ed
      ? `<div class="flux__phase-edition">
           <input class="flux__phase-champ" value="${e(g.label)}" data-champ="phase.${g.debut}.${g.span}"
                  placeholder="nommer cette échelle" title="Renomme l'échelle de temps des ${g.span} étape(s) de ce groupe">
           <button class="bouton--puce bouton--puce-claire" data-action="supprimer-phase"
                   data-i="${g.debut}" data-span="${g.span}" data-role="supprimer"
                   title="Supprimer cette échelle de temps — ses ${g.span} étape(s) rejoignent l'échelle voisine">×</button>
         </div>`
      : `<span class="flux__phase-libelle">${e(g.label)}</span>`;
    return `
      <div class="flux__phase${g.label || ed ? '' : ' flux__phase--vide'}${i > 0 ? ' flux__phase--coupe' : ''}"
           style="grid-row:1;grid-column:${2 + g.debut} / span ${g.span}">
        ${ecart ? `<span class="flux__ecart">${e(ecart)}</span>` : ''}
        ${corps}
      </div>`;
  }).join('');

  /* --- fonds de couloir, tirés sur toute la largeur --- */
  const bandes = roles.map((r, i) => `
    <div class="flux__bande${i % 2 ? ' flux__bande--paire' : ''}" style="grid-row:${2 + i};grid-column:1 / -1"></div>`).join('');

  /* --- étiquettes de rôle --- */
  const etiquettes = roles.map(({ nom: role, iRole }, i) => {
    const [fond, encre] = couleursRole(role);
    const fondBande = i % 2 ? 'var(--blanc-casse)' : 'var(--blanc)';
    const corps = ed
      ? `<input class="flux__role-champ" value="${e(role)}" data-champ="role.${iRole}" title="Renommer le rôle"
                style="--chip-fond:${fond};--chip-encre:${encre}">
         <div class="flux__role-outils">
           <button class="bouton--puce" data-action="monter-role" data-i="${iRole}" ${iRole === 0 ? 'disabled' : ''} title="Monter la ligne">↑</button>
           <button class="bouton--puce" data-action="descendre-role" data-i="${iRole}" ${iRole === p.roles.length - 1 ? 'disabled' : ''} title="Descendre la ligne">↓</button>
           <button class="bouton--puce" data-action="supprimer-role" data-role="supprimer" data-i="${iRole}" title="Supprimer le rôle">×</button>
         </div>`
      : chipRole(role);
    return `
      <div class="flux__etiquette${ed ? ' flux__etiquette--edition' : ''}"
           style="grid-row:${2 + i};grid-column:1;background:${fondBande}">${corps}</div>`;
  }).join('');

  /* --- cellules et cartes --- */
  const cellules = [];
  roles.forEach((r, i) => {
    for (let j = 0; j < n; j++) {
      const coupe = coupures.includes(j) ? ' flux__cellule--coupe' : '';
      const pos = `grid-row:${2 + i};grid-column:${2 + j}`;
      const em = emprise[j];

      if (em.ligne === i) {
        const et = p.etapes[j];
        const cible = ed ? ` data-cellule="${j}" data-role-nom="${e(r.nom)}"` : '';
        const supports = listeSupports(et.supports);
        const partage = em.cheval ? ' flux__carte--cheval' : '';
        const cellCheval = em.cheval ? ' flux__cellule--cheval' : '';
        const marqueCheval = em.cheval ? ` data-cheval="${em.cheval}"` : '';

        if (!ed) {
          cellules.push(`
            <div class="flux__cellule${coupe}${cellCheval}" style="${pos}">
              <div class="flux__carte${partage}" data-etape="${et.ordre}"${marqueCheval}>
                ${bandeauSupports(supports)}
                <span class="flux__carte-texte">${e(et.texte)}</span>
              </div>
            </div>`);
        } else {
          cellules.push(`
            <div class="flux__cellule${coupe}${cellCheval}" style="${pos}"${cible}>
              <div class="flux__carte flux__carte--edition${partage}${etat.etapeActive === et.ordre ? ' flux__carte--actif' : ''}"
                   data-etape="${et.ordre}" data-index="${j}"${marqueCheval}>
                ${bandeauSupportsEdition(j, supports)}
                <div class="carte__tete">
                  <span class="carte__poignee" draggable="true" data-poignee="${j}"
                        title="Glisser sur un autre couloir, ou sur la frontière entre deux couloirs pour dire que les deux sont concernés">⠿</span>
                </div>
                <textarea class="carte__texte" rows="1" data-champ="etape.${j}.texte"
                          placeholder="Action relevée…">${e(et.texte || '')}</textarea>
                ${vueChoixSupport(j, supports)}
                <div class="carte__outils">
                  <button class="bouton--puce" data-action="gauche-etape" data-i="${j}" ${j === 0 ? 'disabled' : ''} title="Décaler à gauche">←</button>
                  <button class="bouton--puce" data-action="droite-etape" data-i="${j}" ${j === n - 1 ? 'disabled' : ''} title="Décaler à droite">→</button>
                  <button class="bouton--puce" data-action="inserer-etape" data-i="${j}" title="Insérer une étape après">+</button>
                  <button class="bouton--puce" data-action="couper-phase" data-i="${j}"
                          title="Commencer une nouvelle échelle de temps à partir de cette étape">${ICONE_COUPURE}</button>
                  <button class="bouton--puce" data-action="supprimer-etape" data-role="supprimer" data-i="${j}" title="Supprimer l'étape">×</button>
                </div>
              </div>
            </div>`);
        }
      } else {
        cellules.push(`<div class="flux__cellule${coupe}" style="${pos}"${
          ed ? ` data-cellule="${j}" data-role-nom="${e(r.nom)}"` : ''}></div>`);
      }

      /* Bande de dépôt sur la frontière avec le couloir suivant. */
      if (ed && i < R - 1) {
        cellules.push(`<div class="flux__frontiere" style="grid-row:${2 + i};grid-column:${2 + j}"
          data-frontiere="${j}" data-role-haut="${e(r.nom)}" data-role-bas="${e(roles[i + 1].nom)}"
          title="Déposer ici : les deux rôles sont concernés"></div>`);
      }
    }

    /* colonne d'ajout en fin de couloir */
    if (ed) {
      cellules.push(`
        <div class="flux__cellule" style="grid-row:${2 + i};grid-column:${2 + n}" data-cellule="${n}" data-role-nom="${e(r.nom)}">
          <button class="flux__ajout" data-action="ajouter-etape-role" data-role-nom="${e(r.nom)}"
                  title="Ajouter une étape sur cette ligne">+ Étape</button>
        </div>`);
    }
  });

/* ==========================================================================
   ENVIRONNEMENT IT — logigramme des échanges entre outils
   Les nœuds sont les outils du site ; les échanges sont déduits des processus
   (une étape sur un outil suivie d'une étape sur un autre = un passage), puis
   ajustables. Dès la première retouche, la liste déduite est figée dans
   `client.si.liens` et devient la source de vérité — un bouton permet de
   la re-déduire depuis les processus.
   ========================================================================== */

/* Domaines fonctionnels : on regroupe les outils par utilité, comme dans les
   slides d'écosystème IT. La devinette par mots-clés ne sert qu'à proposer un
   classement de départ — il est ensuite ajustable outil par outil. */
const DOMAINES_DEFAUT = [
  { nom: 'SIRH & GTA', motifs: ['workday', 'sirh', 'gta', 'kronos', 'cronos', 'horoquartz', 'adp', 'paie', 'pointage', 'badgeage'] },
  { nom: 'Planification', motifs: ['planning', 'myplan', 'ordo', 's&op', 'pdp', 'gpao', 'ordonnancement'] },
  { nom: 'Formations', motifs: ['boost', 'formation', 'sowesign', 'lms', 'learning', 'moodle', 'livret'] },
  { nom: 'Suivi médical', motifs: ['padoa', 'gaia', 'medical', 'medecine', 'visite', 'aptitude'] },
  { nom: 'Qualité', motifs: ['qms', 'qualite', 'r43', 'audit', 'controle'] },
  { nom: 'Production & maintenance', motifs: ['mes', 'production', 'gmao', 'maintenance', 'ligne'] },
  { nom: 'GED & partage', motifs: ['ged', 'sharepoint', 'drive', 'onedrive', 'teams', 'intranet', 'serveur', 'reseau'] },
  { nom: 'ERP', motifs: ['erp', 'sap', 'oracle'] },
  { nom: 'Bureautique & papier', motifs: ['excel', 'word', 'ppt', 'powerpoint', 'mail', 'outlook', 'courriel',
                                          'papier', 'imprime', 'carton', 'formulaire', 'checklist', 'fiche',
                                          'tableur', 'oral', 'reunion'] }
];
const DOMAINE_AUTRE = 'Non classé';
const COULEURS_DOMAINE = ['#2F5D62', '#C0392B', '#5B2333', '#B9761F', '#5B4B8A', '#8E3B5E', '#1F6F6B', '#7A4E2D', '#3E5C8A'];

function domaineDevine(nom) {
  const clef = String(nom || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const d = DOMAINES_DEFAUT.find((x) => x.motifs.some((m) => clef.includes(m)));
  return d ? d.nom : DOMAINE_AUTRE;
}

function couleurDomaine(nom, domaines) {
  const i = domaines.indexOf(nom);
  return COULEURS_DOMAINE[(i < 0 ? 0 : i) % COULEURS_DOMAINE.length];
}

/** Domaine de chaque outil : classement choisi, sinon devinette. */
function classementEffectif(c) {
  const manuel = (c.si && c.si.classement) || {};
  const map = {};
  outilsDuSite(c).forEach((o) => { map[o] = manuel[o] || domaineDevine(o); });
  return map;
}

/** Missions proposées pour un domaine : les processus où ses outils apparaissent.
    C'est le signal le plus proche présent dans les données ; les libellés fins
    (« Absences », « Roulements horaire ») se saisissent ensuite à la main. */
function missionsDerivees(c) {
  const classement = classementEffectif(c);
  const parDomaine = {};
  c.processus.forEach((proc) => {
    const outilsDuProcessus = [];
    proc.etapes.forEach((et) => listeSupports(et.supports).forEach((o) => {
      if (!outilsDuProcessus.includes(o)) outilsDuProcessus.push(o);
    }));
    outilsDuProcessus.forEach((o) => {
      const dom = classement[o];
      if (!dom) return;
      parDomaine[dom] = parDomaine[dom] || [];
      if (!parDomaine[dom].includes(proc.nom)) parDomaine[dom].push(proc.nom);
    });
  });
  return parDomaine;
}

/** Missions effectives : celles saisies si elles existent, sinon les déduites. */
function missionsEffectives(c) {
  const saisies = (c.si && c.si.missions) || null;
  if (saisies) return saisies;
  return missionsDerivees(c);
}

/** Domaines à afficher, dans l'ordre : celui choisi, sinon l'ordre de référence. */
function domainesEffectifs(c) {
  const classement = classementEffectif(c);
  const utilises = [];
  Object.keys(classement).forEach((o) => {
    const d = classement[o];
    if (!utilises.includes(d)) utilises.push(d);
  });
  if (c.si && Array.isArray(c.si.domaines) && c.si.domaines.length) {
    const out = c.si.domaines.slice();          /* garde aussi les domaines encore vides */
    utilises.forEach((d) => { if (!out.includes(d)) out.push(d); });
    return out;
  }
  const ordre = DOMAINES_DEFAUT.map((d) => d.nom).concat([DOMAINE_AUTRE]);
  return ordre.filter((d) => utilises.includes(d));
}

/** Tous les outils du site : ceux déclarés, plus ceux relevés sur les étapes. */
function outilsDuSite(c) {
  const vus = [];
  const noter = (o) => { const v = String(o || '').trim(); if (v && !vus.includes(v)) vus.push(v); };
  (c.outils || []).forEach(noter);
  c.processus.forEach((p) => p.etapes.forEach((et) => listeSupports(et.supports).forEach(noter)));
  return vus;
}

/** Nombre d'étapes qui reposent sur chaque outil. */
function usageOutils(c) {
  const n = {};
  c.processus.forEach((p) => p.etapes.forEach((et) => {
    listeSupports(et.supports).forEach((s) => { n[s] = (n[s] || 0) + 1; });
  }));
  return n;
}

/** Échanges déduits : enchaînement d'étapes sur des outils différents. */
function deriverEchanges(c) {
  const compte = {};
  c.processus.forEach((p) => {
    for (let i = 0; i < p.etapes.length - 1; i++) {
      const a = listeSupports(p.etapes[i].supports);
      const b = listeSupports(p.etapes[i + 1].supports);
      a.forEach((de) => b.forEach((vers) => {
        if (de === vers) return;
        const clef = de + '→' + vers;
        if (!compte[clef]) compte[clef] = { de, vers, nature: '', libelle: '', nb: 0 };
        compte[clef].nb += 1;
      }));
    }
  });
  return Object.keys(compte).map((k) => compte[k]).sort((x, y) => y.nb - x.nb);
}

function echangesEffectifs(c) {
  if (c && c.si && Array.isArray(c.si.liens)) return { liens: c.si.liens, ajuste: true };
  return { liens: c ? deriverEchanges(c) : [], ajuste: false };
}

/** Fige le classement proposé et les échanges déduits, avant la 1re retouche. */
function assurerSI(c) {
  if (!c.si || !Array.isArray(c.si.liens)) {
    c.si = {
      domaines: domainesEffectifs(c),
      classement: classementEffectif(c),
      missions: missionsDerivees(c),
      liens: deriverEchanges(c)
    };
  }
  c.si.domaines = c.si.domaines || domainesEffectifs(c);
  c.si.classement = c.si.classement || classementEffectif(c);
  c.si.missions = c.si.missions || missionsDerivees(c);
  return c.si;
}

function selecteurOutil(champ, valeur, outils) {
  const liste = outils.includes(valeur) ? outils : outils.concat([valeur]);
  return `<select class="selecteur selecteur--compact" data-champ="${e(champ)}">${
    liste.map((o) => `<option value="${e(o)}"${o === valeur ? ' selected' : ''}>${e(o)}</option>`).join('')
  }</select>`;
}

/** Échanges agrégés au niveau des blocs. Un échange interne à un domaine ne
    donne pas de flèche : elle boucherait sur elle-même sans rien apprendre. */
function echangesBlocs(c) {
  const classement = classementEffectif(c);
  const { liens } = echangesEffectifs(c);
  const agg = {};
  liens.forEach((l) => {
    const a = classement[l.de], b = classement[l.vers];
    if (!a || !b || a === b) return;
    const k = a + '\u2192' + b;
    if (!agg[k]) agg[k] = { de: a, vers: b, nb: 0, natures: [] };
    agg[k].nb += 1;
    agg[k].natures.push(l.nature || '');
  });
  return Object.keys(agg).map((k) => {
    const x = agg[k];
    const uniques = x.natures.filter((n, i) => x.natures.indexOf(n) === i);
    return { de: x.de, vers: x.vers, nb: x.nb, nature: uniques.length === 1 ? uniques[0] : '' };
  });
}

/** Ordre des blocs : on place d'abord le domaine le plus connecté, puis à côté
    celui qui échange le plus avec les précédents. Raccourcit les flèches et
    limite les croisements. */
function ordonnerDomaines(domaines, liensBlocs) {
  const poids = {};
  domaines.forEach((d) => { poids[d] = 0; });
  liensBlocs.forEach((l) => {
    if (poids[l.de] != null) poids[l.de] += l.nb;
    if (poids[l.vers] != null) poids[l.vers] += l.nb;
  });
  const restants = domaines.slice().sort((a, b) => (poids[b] - poids[a]) || domaines.indexOf(a) - domaines.indexOf(b));
  const ordre = [];
  while (restants.length) {
    let choix = 0;
    if (ordre.length) {
      let meilleur = -1;
      restants.forEach((d, i) => {
        const score = liensBlocs.reduce((n, l) => n + (
          ((l.de === d && ordre.indexOf(l.vers) > -1) || (l.vers === d && ordre.indexOf(l.de) > -1)) ? l.nb : 0), 0);
        if (score > meilleur) { meilleur = score; choix = i; }
      });
    }
    ordre.push(restants.splice(choix, 1)[0]);
  }
  return ordre;
}

function selecteurDomaine(champ, valeur, domaines) {
  const liste = domaines.includes(valeur) ? domaines : domaines.concat([valeur]);
  return `<select class="si__noeud-domaine" data-champ="${e(champ)}" title="Changer le domaine de cet outil">${
    liste.map((d) => `<option value="${e(d)}"${d === valeur ? ' selected' : ''}>${e(d)}</option>`).join('')
  }</select>`;
}

function selecteurNature(champ, valeur) {
  const choix = [['', 'Non qualifié'], ['auto', 'Automatique'], ['manuel', 'Manuel']];
  return `<select class="selecteur selecteur--compact" data-champ="${e(champ)}">${
    choix.map(([v, l]) => `<option value="${v}"${v === valeur ? ' selected' : ''}>${l}</option>`).join('')
  }</select>`;
}

function vueEnvironnementIT() {
  const c = client();
  if (!c) return '';
  const ed = etat.edition && !etat.impression;
  const outils = outilsDuSite(c);
  const usage = usageOutils(c);
  const { liens, ajuste } = echangesEffectifs(c);

  if (!outils.length) {
    return `
    <section class="section section--si">
      <div class="groupe" style="gap:6px">
        <span class="libelle libelle--large">Environnement IT</span>
        <h2>Échanges entre les outils</h2>
      </div>
      <div class="vide" style="margin:0">
        <span class="vide__titre">Aucun outil relevé</span>
        <span class="sourdine">Renseignez les supports sur les étapes : le logigramme se construira tout seul.</span>
      </div>
    </section>`;
  }

  /* --- blocs par domaine fonctionnel, en mosaïque --- */
  const classement = classementEffectif(c);
  const missions = missionsEffectives(c);
  const domainesBruts = domainesEffectifs(c);
  const liensBlocs = echangesBlocs(c);
  const domaines = ordonnerDomaines(domainesBruts, liensBlocs);

  const grille = domaines.map((dom) => {
    const dedans = outils.filter((o) => classement[o] === dom);
    const couleur = couleurDomaine(dom, domainesBruts);
    const iDom = domainesBruts.indexOf(dom);
    const mis = missions[dom] || [];
    const titre = ed
      ? `<span class="si__bloc-titre" style="background:${couleur}">
           <input class="si__bloc-champ" value="${e(dom)}" data-champ="dom.${iDom}" title="Renommer ce domaine"
                  style="width:${Math.max(8, Math.min(24, dom.length + 1))}ch">
           <button class="bouton--retirer" data-action="supprimer-domaine" data-i="${iDom}"
                   title="Supprimer ce domaine — ses outils repassent en « ${DOMAINE_AUTRE} »">×</button>
         </span>`
      : `<span class="si__bloc-titre" style="background:${couleur}">${e(dom)}</span>`;
    return `
      <div class="si__bloc" data-domaine="${e(dom)}" style="--c:${couleur}">
        <div class="si__bloc-entete">
          ${titre}
          ${dedans.length ? `<span class="si__bloc-outils">${dedans.map((o) => `
            <span class="si__outil${dedans.length > 2 ? ' si__outil--compact' : ''}"
                  title="${e(o)} — ${usage[o] || 0} étape(s)">${badgeSupport(o)}${
              dedans.length > 2 ? '' : e(o)}</span>`).join('')}
          </span>` : ''}
        </div>
        <div class="si__bloc-missions">
          ${mis.map((m, k) => ed
            ? `<span class="si__mission si__mission--modif">
                 <input class="si__mission-champ" value="${e(m)}" data-champ="mission.${iDom}.${k}"
                        style="width:${Math.max(8, Math.min(28, String(m).length + 1))}ch"
                        placeholder="mission">
                 <button class="bouton--retirer" data-action="supprimer-mission"
                         data-i="${iDom}" data-k="${k}" title="Retirer cette mission">×</button>
               </span>`
            : `<span class="si__mission">${e(m)}</span>`).join('')}
          ${!mis.length && !ed
            ? `<span class="si__bloc-vide">${dedans.length ? 'Aucune mission relevée' : 'Aucun outil — bloc à alimenter'}</span>`
            : ''}
          ${ed ? `<button class="si__mission-ajout" data-action="ajouter-mission" data-i="${iDom}"
                          title="Ajouter une mission à ce domaine">+ mission</button>` : ''}
        </div>
      </div>`;
  }).join('');

  /* --- classement des outils, en édition : une liste plutôt que des menus
         dans chaque bloc, plus simple à parcourir quand on en reclasse plusieurs --- */
  const listeClassement = ed ? `
    <div class="carte ne-pas-imprimer" style="gap:12px">
      <span class="libelle libelle--large">Classement des outils</span>
      <div class="si__classement">
        ${outils.map((o) => `
          <div class="si__classement-ligne">
            <span class="si__outil">${badgeSupport(o)}${e(o)}</span>
            ${selecteurDomaine(`classe.${o}`, classement[o], domainesBruts)}
          </div>`).join('')}
      </div>
    </div>` : '';

  /* --- liste des échanges, éditable --- */
  const lignes = liens.map((l, i) => ed
    ? `<div class="si__ligne">
         ${selecteurOutil(`si.${i}.de`, l.de, outils)}
         <span class="si__fleche-texte">→</span>
         ${selecteurOutil(`si.${i}.vers`, l.vers, outils)}
         ${selecteurNature(`si.${i}.nature`, l.nature || '')}
         <input class="champ" value="${e(l.libelle || '')}" data-champ="si.${i}.libelle"
                placeholder="ce qui passe (ex. dates de recyclage)">
         <button class="bouton bouton--carre" data-action="supprimer-echange" data-role="supprimer" data-i="${i}"
                 title="Supprimer cet échange">×</button>
       </div>`
    : `<div class="si__ligne si__ligne--lecture">
         <span class="si__paire">${badgeSupport(l.de)}<span>${e(l.de)}</span></span>
         <span class="si__fleche-texte" style="color:${LIENS[l.nature || ''].couleur}">→</span>
         <span class="si__paire">${badgeSupport(l.vers)}<span>${e(l.vers)}</span></span>
         <span class="si__nature" style="color:${LIENS[l.nature || ''].couleur}">${LIENS[l.nature || ''].libelle}</span>
         <span class="sourdine">${e(l.libelle || '')}</span>
       </div>`).join('');

  const legende = `
    <div class="flux__legende">
      ${['auto', 'manuel', ''].map((k) => `
        <span class="flux__legende-item">
          <span class="flux__legende-trait" style="border-top-color:${LIENS[k].couleur};border-top-style:${LIENS[k].tirets ? 'dashed' : 'solid'}"></span>
          ${LIENS[k].libelle}
        </span>`).join('')}
    </div>`;

  return `
  <section class="section section--si">

          ${ajuste ? 'Classement et échanges ajustés à la main' : 'Classement proposé, échanges déduits des processus'}
        </span>

}

function vueSynthese(totaux) {

        <span class="kpi__libelle">frictions</span>
      </div>

  return `
  <section class="section section--synthese">
    <div class="groupe" style="gap:6px">
      <span class="libelle libelle--large">Synthèse globale</span>
      <h2>État des lieux du site</h2>
    </div>
    <div class="synthese-grille" style="--np:${Math.max(1, Math.min(4, c.processus.length))}">${cartes}</div>
    <div class="grille-bilan">
      <div class="carte-inventaire">
        <span class="libelle libelle--large">Rôles cartographiés</span>
        <div class="nuage">${rolesGlobaux().map((r) => chipRole(r, 'large')).join('')}</div>
        <span class="libelle libelle--large">Outils et supports relevés</span>
        <div class="nuage">${(c.outils || []).map((o) => `<span class="etiquette-outil">${e(o)}</span>`).join('')}</div>
        <span class="sourdine" style="line-height:1.5;text-wrap:pretty">${e(c.notes || '')}</span>
      </div>

        </span>
